<!DOCTYPE html>
<html>
<head>
<base target="_top">
<title>Cashflow Tracker V0.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --surface: #ffffff;
    --page: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: #e1e0d9;
    --border-strong: #c3c2b7;
    --accent: #2a78d6;
    --accent-bg: rgba(42, 120, 214, 0.1);
    --danger: #e34948;
    --good: #0ca30c;
    --shadow: rgba(0, 0, 0, 0.08) 0 4px 16px -4px;
    --banner: #fdf6e3;
    --banner-border: #eadfb4;
    --banner-text: #6b5b1e;
    --year-shade: rgba(0, 0, 0, 0.035);
    --actual: #0a8f6b;
    --actual-bg: rgba(10, 143, 107, 0.1);
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19;
    --page: #121211;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: #2c2c2a;
    --border-strong: #383835;
    --accent: #3987e5;
    --accent-bg: rgba(57, 135, 229, 0.15);
    --danger: #e66767;
    --good: #0ca30c;
    --shadow: rgba(0, 0, 0, 0.4) 0 4px 16px -4px;
    --banner: #2a2410;
    --banner-border: #4a3f16;
    --banner-text: #e0c869;
    --year-shade: rgba(255, 255, 255, 0.045);
    --actual: #2fd39a;
    --actual-bg: rgba(47, 211, 154, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1a1a19;
      --page: #121211;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: #2c2c2a;
      --border-strong: #383835;
      --accent: #3987e5;
      --accent-bg: rgba(57, 135, 229, 0.15);
      --danger: #e66767;
      --good: #0ca30c;
      --shadow: rgba(0, 0, 0, 0.4) 0 4px 16px -4px;
      --banner: #2a2410;
      --banner-border: #4a3f16;
      --banner-text: #e0c869;
      --year-shade: rgba(255, 255, 255, 0.045);
      --actual: #2fd39a;
      --actual-bg: rgba(47, 211, 154, 0.15);
    }
  }

  /* Custom accent/actuals colors (user-picked) are applied as inline styles on
     :root by the theme picker's <input type="color">, not as CSS here — see
     applyCustomColor()/refreshCustomColors() in the theme-picker script below.
     Absent a custom pick, the --accent/--actual defaults above (light/dark) apply. */

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
  }
  button, input, select { font-family: inherit; font-size: inherit; }
  input, select {
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 6px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .demo-banner {
    background: var(--banner);
    border-bottom: 1px solid var(--banner-border);
    color: var(--banner-text);
    font-size: 12.5px;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    text-align: center;
  }
  .demo-banner strong { font-weight: 700; }

  .app { max-width: 1400px; margin: 0 auto; padding: 0 24px 64px; }

  .app-topbar { display: flex; align-items: center; gap: 16px; padding: 10px 0; }
  .app-topbar__title { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .app-topbar__spacer { flex: 1; }

  .project-header {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .project-header--collapsed { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
  .project-header__collapsed-name { font-size: 16px; font-weight: 600; }
  .project-header__collapsed-left { display: flex; flex-direction: column; }
  .project-header__brand { display: block; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 2px; }
  .project-header__top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .project-header__name { font-size: 22px; font-weight: 700; margin-bottom: 0; width: auto; flex: 1; }
  .project-header__meta { display: flex; gap: 32px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
  .project-header__meta b { display: block; color: var(--text-secondary); font-weight: 500; font-size: 13px; margin-top: 2px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    background: none; border: none; padding: 10px 16px; cursor: pointer; color: var(--text-secondary);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab--active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .section { display: flex; flex-direction: column; gap: 20px; }
  .section__intro { color: var(--text-secondary); max-width: 720px; line-height: 1.5; }

  .link-button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: inherit; }
  .link-button:hover { text-decoration: underline; }
  .link-button:disabled { color: var(--text-muted); cursor: not-allowed; }
  .link-button--danger { color: var(--danger); }
  .secondary-button {
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 8px 14px; cursor: pointer; color: var(--text-primary); align-self: flex-start;
  }
  .secondary-button:hover { border-color: var(--accent); }
  .secondary-button:disabled { color: var(--text-muted); cursor: not-allowed; }

  .category-group { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .category-group__header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--page); border-bottom: 1px solid var(--border);
  }
  .category-group__title { font-weight: 600; flex: 1; }
  .category-group__total { font-variant-numeric: tabular-nums; color: var(--text-secondary); }

  table.line-items-table, table.summary-grid { width: 100%; border-collapse: collapse; }
  .line-items-table th, .line-items-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  .line-items-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; }
  .col-money { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .col-code { width: 90px; }
  .col-date { width: 140px; }
  .col-category { width: 180px; }
  .col-schedule { width: 300px; }
  .col-actions { width: 90px; text-align: right !important; }

  .editable-text, .editable-number {
    border: 1px solid transparent; background: transparent; width: 100%; padding: 3px 4px; border-radius: 4px;
  }
  .editable-text:hover, .editable-number:hover { border-color: var(--border); }
  .editable-number { text-align: right; }
  .category-select { display: block; width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 4px; border-radius: 4px; }
  .category-select:hover { border-color: var(--border); }
  .money-input { position: relative; display: block; }
  .money-input::before { content: "$"; position: absolute; left: 7px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .money-input .editable-number { padding-left: 16px; }

  .add-row td { padding: 8px 16px; }
  .total-row td { font-weight: 600; border-top: 2px solid var(--border-strong); border-bottom: none; }
  .draws-table__actual-col { background: var(--actual-bg); }
  .draws-table__variance { font-variant-numeric: tabular-nums; font-weight: 600; }
  .draws-table__variance--over { color: var(--danger); }
  .draws-table__variance--under { color: var(--actual); }

  .schedule-row td { background: var(--page); padding: 16px !important; }
  .schedule-editor { display: flex; flex-direction: column; gap: 12px; }
  .schedule-editor__mode { display: flex; gap: 24px; font-size: 13px; }
  .schedule-editor__mode label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .schedule-editor__even { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .schedule-editor__even label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .schedule-editor__hint { font-size: 12px; color: var(--text-secondary); }
  .schedule-editor__variance { font-size: 12px; color: var(--danger); }

  .actuals-editor { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
  .actuals-editor__title { font-size: 12px; font-weight: 600; color: var(--actual); }
  .actuals-editor__hint { font-weight: 400; color: var(--text-muted); }
  .actuals-editor__total { font-size: 12px; color: var(--text-secondary); }

  .mini-table { border-collapse: collapse; font-size: 13px; }
  .mini-table td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--border); }
  .mini-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; text-align: left; padding: 4px 10px 4px 0; }
  .mini-table input { width: 130px; }

  .summary-grid-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  /* --cf-zoom is a live-updating multiplier (1 = 100%) set on .summary-grid-wrap by the
     Zoom slider — kept to a plain CSS custom property (not a full re-render) so dragging
     the slider stays smooth even on large grids. */
  .summary-grid { font-size: calc(12.5px * var(--cf-zoom, 1)); }
  .summary-grid th, .summary-grid td { padding: calc(5px * var(--cf-zoom, 1)) calc(10px * var(--cf-zoom, 1)); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .summary-grid th { position: sticky; top: 0; background: var(--surface); color: var(--text-muted); font-weight: 500; text-align: right; z-index: 2; }
  .summary-grid__label { text-align: left !important; position: sticky; left: 0; background: var(--surface); min-width: 260px; z-index: 1; }
  .summary-grid__budget { position: sticky; left: var(--budget-col-left, 260px); background: var(--surface); box-shadow: 2px 0 4px -2px rgba(0,0,0,0.15); z-index: 1; }
  .summary-grid th.summary-grid__label, .summary-grid th.summary-grid__budget { z-index: 3; }
  .summary-grid__code { color: var(--text-muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .summary-grid__monthnum { display: block; font-size: calc(9.5px * var(--cf-zoom, 1)); font-weight: 400; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .summary-grid__monthlabel { display: block; }
  .summary-grid__category td { font-weight: 600; background: var(--page); border-top: 2px solid var(--border-strong); padding-top: calc(5px * var(--cf-zoom, 1) + var(--section-gap, 0px)); }
  .summary-grid__category td.summary-grid__label, .summary-grid__category td.summary-grid__budget { background: var(--page); }
  .summary-grid__subtotal td { font-weight: 600; border-top: 1px solid var(--border-strong); }
  .summary-grid__grandtotal td { font-weight: 700; border-top: 2px solid var(--border-strong); font-size: calc(13.5px * var(--cf-zoom, 1)); }
  .summary-grid-controls { display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-bottom: 10px; position: relative; z-index: 4; }
  .summary-grid-controls__gap { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .summary-grid-controls__gap input { width: 48px; }
  .summary-grid td.summary-grid__colored, .summary-grid th.summary-grid__colored { background: var(--cell-bg) !important; }
  .summary-grid tr[data-item-row-cf] td:not(.summary-grid__colored) { cursor: context-menu; }
  .cf-color-menu { position: fixed; z-index: 200; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .cf-color-menu label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
  .cf-color-menu input[type="color"] { width: 32px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 24px; }
  .modal-card { background: var(--surface); border-radius: 10px; padding: 24px; max-width: 720px; width: 100%; max-height: 85vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-card h2 { margin: 0 0 12px; }
  .modal-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--text-secondary); }
  .modal-card__actions { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  .csv-import-mapping select { width: 220px; }
  .cashflow-table-section--full { width: 100vw; max-width: 100vw; box-sizing: border-box; margin-left: calc(-50vw + 50%); margin-right: calc(-50vw + 50%); padding: 0 24px; }
  .summary-grid__expand-toggle { background: none; border: none; cursor: pointer; padding: 0 6px 0 0; color: var(--text-muted); font-size: 10px; vertical-align: middle; }
  .summary-grid__expand-toggle:hover { color: var(--text-primary); }
  .summary-grid__budgetline td { color: var(--text-muted); font-size: calc(11.5px * var(--cf-zoom, 1)); font-weight: 400 !important; }
  .summary-grid__budgetline td.summary-grid__label, .summary-grid__budgetline td.summary-grid__budget { background: var(--surface); }
  .summary-grid__budgetline-desc { padding-left: 20px; }
  .summary-grid__actual td { color: var(--actual); font-size: calc(11.5px * var(--cf-zoom, 1)); font-style: italic; background: var(--actual-bg) !important; border-bottom: 1px solid var(--border); }
  /* The sticky label/budget columns need an OPAQUE background, not the translucent
     --actual-bg used elsewhere in the row — a translucent sticky cell lets the
     month columns scrolling underneath show through their text as they pass beneath
     it, so mix the tint into --surface (opaque) instead of layering it on with alpha. */
  .summary-grid__actual td.summary-grid__label, .summary-grid__actual td.summary-grid__budget { background: color-mix(in srgb, var(--actual) 12%, var(--surface)) !important; }
  .summary-grid__actual-label { padding-left: 20px; }
  .summary-grid td.summary-grid__month--current, .summary-grid th.summary-grid__month--current { background: var(--accent-bg) !important; }
  .summary-grid__year-b { background: var(--year-shade); }
  .summary-grid__notes td { background: var(--surface); border-bottom: 2px solid var(--border-strong); }
  .summary-grid__notenote { width: 100%; min-width: 90px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); font-size: calc(11px * var(--cf-zoom, 1)); font-style: italic; padding: 3px 4px; border-radius: 4px; }
  .summary-grid__notenote:hover, .summary-grid__notenote:focus { border-color: var(--border); font-style: normal; outline: none; }
  /* Deliberately not .col-money — these aren't monetary values, and giving them that
     class would make them selectable/summable by the Excel-like cell-selection feature. */
  .summary-grid__rangecol { text-align: right; color: var(--text-muted); font-size: 0.92em; white-space: nowrap; }

  .cashflow-chart { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .cashflow-chart h3 { margin: 0; font-size: 14px; color: var(--text-secondary); }
  .cashflow-chart__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cashflow-chart .bar { fill: var(--accent); }
  .cashflow-chart .gridline { stroke: var(--border); stroke-width: 1; }
  .cashflow-chart .axis-label { fill: var(--text-muted); font-size: 9.5px; font-family: system-ui, sans-serif; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); display: none; z-index: 10;
  }

  /* ---- Cashflow timeline (heatmap) ---- */
  .cf-timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .cf-timeline__header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .cf-timeline__header h3 { margin: 0; font-size: 14px; color: var(--text-secondary); }
  .cf-timeline__legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
  .cf-timeline__legend-scale { display: flex; }
  .cf-timeline__legend-step { width: 16px; height: 10px; border: 1px solid var(--border); border-left: none; }
  .cf-timeline__legend-step:first-child { border-left: 1px solid var(--border); }
  .cf-timeline__hint { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
  .budget-mismatch {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 10px;
    font-size: 10.5px; white-space: nowrap; cursor: help;
    color: #8a4b00; background: rgba(214, 138, 10, 0.14); border: 1px solid rgba(214, 138, 10, 0.4);
  }
  :root[data-theme="dark"] .budget-mismatch { color: #f0b45c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .budget-mismatch { color: #f0b45c; } }
  .cf-timeline-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; margin: 10px 0; font-size: 12px; color: var(--text-secondary); }
  .cf-timeline-controls label { display: flex; align-items: center; gap: 6px; }
  .cf-timeline-controls__range input[type="range"] { width: 96px; accent-color: var(--accent); }
  .cf-timeline-controls__range span { min-width: 34px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cf-timeline-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; width: fit-content; max-width: 100%; }
  /* max-content keeps the month columns at their intended size instead of letting
     auto table layout spread them across whatever container the table lands in. */
  .cf-heatmap { border-collapse: separate; border-spacing: 0; font-size: 12px; width: max-content; }
  .cf-heatmap th, .cf-heatmap td { padding: 0; white-space: nowrap; }
  .cf-heatmap thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; color: var(--text-muted); font-weight: 500; }
  .cf-heatmap__label {
    position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left;
    min-width: 240px; max-width: 240px; overflow: hidden; text-overflow: ellipsis;
    padding: 0 10px !important; border-bottom: 1px solid var(--border);
    box-shadow: 2px 0 4px -2px rgba(0,0,0,0.15);
  }
  .cf-heatmap thead th.cf-heatmap__label { z-index: 3; }
  .cf-heatmap__yearhead { text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); padding: 3px 0 !important; }
  .cf-heatmap__yearhead--b { background: var(--year-shade); }
  .cf-heatmap__monthhead { text-align: center; font-size: 9px; padding: 2px 0 !important; border-bottom: 1px solid var(--border); }
  .cf-heatmap__cell {
    padding: calc(var(--pill-gap, 4px) / 2) !important; cursor: pointer;
    width: calc(var(--pill-w, 22px) + var(--pill-gap, 4px));
    min-width: calc(var(--pill-w, 22px) + var(--pill-gap, 4px));
  }
  .cf-heatmap__cell--empty { cursor: default; }
  .cf-heatmap__pill {
    display: block; width: var(--pill-w, 22px); height: var(--pill-h, 12px);
    border-radius: 999px; background: transparent;
  }
  .cf-heatmap__cell:not(.cf-heatmap__cell--empty):hover .cf-heatmap__pill { outline: 2px solid var(--text-primary); outline-offset: 1px; }
  /* Actual sub-row: thinner pills on the same track, so the eye reads it as a
     dimmer companion line directly under its budget row rather than a peer row. */
  .cf-heatmap__actual-row td { background: var(--actual-bg); border-bottom: 1px solid var(--border); }
  .cf-heatmap__actual-row td.cf-heatmap__label, .cf-heatmap__actual-row td.cf-heatmap__row-total { background: var(--actual-bg); color: var(--actual); font-style: italic; }
  .cf-heatmap__actual-label { font-size: 10.5px; opacity: 0.85; }
  .cf-heatmap__pill--actual {
    height: calc(var(--pill-h, 12px) * 0.55);
    margin: calc((var(--pill-h, 12px) - (var(--pill-h, 12px) * 0.55)) / 2) 0;
  }
  .cf-heatmap__row-total { padding: 0 10px !important; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); background: var(--surface); border-bottom: 1px solid var(--border); }
  .cf-heatmap__category td { font-weight: 600; background: var(--page); border-top: 2px solid var(--border-strong); padding-top: calc(2px + var(--section-gap, 0px)) !important; }
  .cf-heatmap__category td.cf-heatmap__label { background: var(--page); }
  .cf-heatmap__subtotal td { font-weight: 600; }
  .cf-heatmap__subtotal td.cf-heatmap__label { border-top: 1px solid var(--border-strong); }
  .cf-heatmap__grandtotal td { font-weight: 700; }
  .cf-heatmap__grandtotal td.cf-heatmap__label { border-top: 2px solid var(--border-strong); }
  .cf-heatmap__code { color: var(--text-muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  /* Marks the current month as one continuous vertical rule down the timeline. */
  .cf-heatmap__current { box-shadow: inset 2px 0 0 0 var(--accent); }

  .summary-section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-strong); }
  .summary-section-header:first-child { margin-top: 0; }
  .summary-section-header h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-primary); }

  .annual-grid-wrap { max-height: none; }
  .annual-grid th, .annual-grid td { position: static !important; box-shadow: none !important; }
  .annual-draw-summary__draw-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .annual-draw-summary__draw-header label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .annual-draw-summary__period { font-size: 12px; color: var(--text-muted); }
  .draw-actual-compare { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 8px 0 4px; padding: 8px 12px; background: var(--actual-bg); border-radius: 6px; font-size: 12px; color: var(--text-secondary); }
  .draw-actual-compare__actual { color: var(--actual); }
  .draw-actual-compare strong { font-variant-numeric: tabular-nums; }
  .cap-table-summary { width: 100%; }
  .cap-table-summary th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 500; text-align: left; padding: 4px 10px 4px 0; }

  .auto-split { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .auto-split h3 { margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .auto-split__controls { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .auto-split__controls label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .auto-badge { display: block; font-size: 10px; color: var(--text-muted); text-align: right; }

  .ledger { display: flex; gap: 32px; flex-wrap: wrap; }
  .ledger__column h4 { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--text-primary); color: var(--surface); padding: 8px 16px; border-radius: 6px;
    font-size: 12.5px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 50;
  }
  .toast--visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Excel-like cashflow cell selection: a status bar pinned to the bottom of the
     viewport (outside the re-rendered tab content, so it survives across renders)
     plus an outline on selected <td>s that draws over any cell/row coloring or the
     actual-row background since those set `background` with !important. */
  .cf-selection-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 80; display: none;
    align-items: center; justify-content: flex-end; gap: 24px; padding: 8px 24px;
    background: var(--surface); border-top: 1px solid var(--border-strong);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08); font-size: 12.5px; color: var(--text-secondary);
  }
  .cf-selection-bar strong { color: var(--text-primary); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .summary-grid__cell--selected { outline: 2px solid var(--accent); outline-offset: -2px; }

  .setup-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .setup-gate__card { max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
  .setup-gate__card h1 { font-size: 20px; margin: 0; }
  .setup-gate__card p { color: var(--text-secondary); line-height: 1.5; margin: 0; font-size: 13px; }
  .setup-gate__field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .setup-gate__field input { font-size: 12.5px; }
  .setup-gate__error { color: var(--danger) !important; }
  .signed-in-bar { display: flex; align-items: center; gap: 12px; justify-content: center; padding: 6px 24px; font-size: 11.5px; color: var(--text-muted); border-bottom: 1px solid var(--border); }

  /* On-screen print preview (mirrors the @media print rules below, live) */
  .print-preview-bar {
    position: sticky; top: 0; z-index: 100; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); color: var(--text-primary);
    border-bottom: 1px solid var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 10px 24px;
  }
  /* Settings live in a drawer pinned to the right edge. position:fixed works from
     inside the sticky bar because the bar creates no containing block for it, and
     keeping it out of flow means the bar's own height stays just the action row. */
  #ppSettingsPanel {
    position: fixed; right: 0; bottom: 0; z-index: 101;
    width: min(374px, 92vw); display: flex; flex-direction: column; gap: 8px;
    padding: 0 12px 14px; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border-left: 1px solid var(--border-strong);
    box-shadow: -6px 0 18px rgba(0,0,0,0.08);
    transition: transform 0.18s ease;
  }
  body.pp-panel-closed #ppSettingsPanel { transform: translateX(100%); }
  .pp-panel-head {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
    margin: 0 -12px 4px; padding: 9px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .pp-panel-head__title { flex: 1; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
  .pp-panel-head__close { width: 24px; height: 24px; padding: 0 !important; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; }
  /* One column in a narrow drawer; the sections group no longer needs to span. */
  #ppSettingsPanel .pp-groups { grid-template-columns: 1fr; }
  #ppSettingsPanel .pp-group--sections { grid-column: auto; }
  #ppSettingsPanel .pp-section-row { gap: 6px; }
  /* Keep every row one line tall; ellipsis is the fallback if a label ever outgrows it. */
  #ppSettingsPanel .pp-section-row__name { white-space: nowrap; overflow: hidden; }
  #ppSettingsPanel .pp-section-row__name > :last-child { overflow: hidden; text-overflow: ellipsis; }
  #ppSettingsPanel .pp-section-row select { min-width: 84px; }
  /* Keep the pages clear of the drawer instead of scrolling underneath it. */
  @media (min-width: 760px) {
    body.pp-panel-open .print-pages { padding-right: min(374px, 92vw); }
  }
  .print-preview-bar__row { display: flex; align-items: center; gap: 12px; }
  .print-preview-bar__label { font-weight: 600; flex: 1; }

  /* ---- grouped print settings ---- */
  .pp-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; align-items: start; }
  .pp-group { background: var(--page); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pp-group--collapsed .pp-group__body { display: none; }
  /* Always the full width of whatever column count auto-fit lands on, so the
     section rows never get squeezed into a single narrow column. */
  .pp-group--sections { grid-column: 1 / -1; }
  .pp-group__title {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 4px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-size: 10.5px; font-weight: 700; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .pp-group--collapsed .pp-group__title { border-bottom-color: transparent; }
  .pp-group__toggle {
    flex: 0 0 auto; width: 20px; height: 20px; padding: 0 !important;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1;
  }
  .pp-group__title-note { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.65; font-size: 10px; }
  .pp-group__body { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 9px 10px; font-size: 11px; }
  .pp-group__hint { flex: 1 1 100%; margin: 0; font-size: 10px; opacity: 0.7; line-height: 1.4; }
  .pp-field { display: flex; flex-direction: column; gap: 3px; opacity: 0.95; }
  .pp-field--full { flex: 1 1 100%; }
  .pp-field__legend { opacity: 0.95; }
  .pp-group select, .pp-group input[type="number"], .pp-group input[type="text"] {
    font-size: 12px; padding: 3px 5px; border-radius: 4px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary);
  }
  .pp-group select, .pp-group input[type="number"] { width: 100%; min-width: 68px; }
  .pp-group input[type="text"] { width: 100%; }
  .pp-group__body, .pp-field, .pp-check { color: var(--text-secondary); }
  .pp-check { display: flex; flex-direction: row; align-items: center; gap: 6px; opacity: 0.95; }
  .pp-margins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pp-margins label { display: flex; flex-direction: column; gap: 2px; font-size: 10px; opacity: 0.85; }
  /* Four inputs in one row can't honour the group-wide min-width without spilling. */
  .pp-margins input[type="number"] { min-width: 0; }

  .pp-sections { flex: 1 1 100%; display: flex; flex-direction: column; gap: 4px; }
  .pp-section-row {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 3px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
  }
  .pp-section-row--off { opacity: 0.55; }
  .pp-section-row__move { display: flex; gap: 2px; }
  .pp-section-row__move button {
    padding: 0; width: 20px; height: 20px; line-height: 1; font-size: 11px;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
  }
  .pp-section-row__move button:disabled { opacity: 0.3; cursor: not-allowed; }
  .pp-section-row__name { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .pp-section-row__ord { opacity: 0.55; font-variant-numeric: tabular-nums; min-width: 14px; }
  .pp-section-row select { width: auto; min-width: 92px; }
  .pp-reset { flex: 0 0 auto; font-size: 11px; padding: 4px 10px !important; margin-top: 2px; }
  .print-pages__zoom-auto { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; }
  .print-preview-bar button {
    background: var(--surface); color: var(--text-primary);
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  .print-preview-bar button:hover { background: var(--page); border-color: var(--accent); }
  .print-preview-bar__label { color: var(--text-primary); }
  /* Printed output is always the light palette, regardless of the app's current
     data-theme — printing dark-theme colors (white text, near-black borders meant
     for a dark backdrop) onto white paper reads as broken, not "dark mode paper".
     Setting these custom properties directly on the body.print-preview-mode element
     overrides whatever :root[data-theme] supplied, since inheritance is resolved from
     the nearest ancestor that redeclares a property — every descendant (including the
     exportPdf() reader, which walks this same live DOM) sees the light values. */
  .print-preview-mode {
    background: #fff; font-size: calc(1em * var(--print-font-scale, 1));
    /* --accent/--accent-bg/--actual/--actual-bg are deliberately NOT reset here: those
       can be a user-chosen custom color (an inline style on <html>, independent of
       data-theme) which should still come through in print, so only the properties
       that genuinely flip between the light/dark theme presets are forced back. */
    --surface: #ffffff; --page: #ffffff;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --border: #e1e0d9; --border-strong: #c3c2b7;
    --danger: #e34948; --good: #0ca30c;
    --banner: #fdf6e3; --banner-border: #eadfb4; --banner-text: #6b5b1e;
    --year-shade: rgba(0, 0, 0, 0.035);
  }
  .print-preview-mode.print-grayscale .print-pages { filter: grayscale(1); }
  .print-preview-mode .app-topbar, .print-preview-mode .tabs, .print-preview-mode .signed-in-bar { display: none !important; }
  .print-preview-mode .app, .print-preview-mode .section { max-width: none; }
  .print-preview-mode .summary-grid-wrap { overflow: visible !important; max-height: none !important; border: none; }
  /* The on-screen wrap scrolls and is capped at 70vh / 100% width; leaving that in
     place for print both clips the chart and makes applyFitScaling measure the
     clipped box instead of the table's natural size. */
  .print-preview-mode .cf-timeline-wrap {
    overflow: visible !important; max-height: none !important;
    width: auto !important; max-width: none !important; border: none;
  }
  .print-preview-mode .cf-timeline { border: none; box-shadow: none; padding: 0; }
  .print-preview-mode .cf-heatmap thead th, .print-preview-mode .cf-heatmap__label { position: static !important; box-shadow: none !important; }
  .print-preview-mode .summary-grid th, .print-preview-mode .summary-grid__label, .print-preview-mode .summary-grid__budget { position: static !important; box-shadow: none !important; }
  /* Full padding shorthand (not just top/bottom): the base rule sets horizontal
     padding via calc(10px * var(--cf-zoom)), and the on-screen Cashflow tab's zoom
     level has nothing to do with print — resetting only the vertical sides left
     zoomed horizontal padding leaking into print/PDF column widths and margins. */
  .print-preview-mode .summary-grid th, .print-preview-mode .summary-grid td { padding: var(--print-row-padding, 5px) 10px; }
  .print-preview-mode .cashflow-chart, .print-preview-mode .summary-grid-wrap, .print-preview-mode .draws-summary { border: none; box-shadow: none; }
  .print-preview-mode tr { page-break-inside: avoid; }
  .print-preview-mode .print-real-content { display: none !important; }
  .print-preview-mode .summary-grid { font-size: calc(12.5px * var(--print-font-scale, 1)); }
  .print-preview-mode .summary-grid__monthnum { font-size: calc(9.5px * var(--print-font-scale, 1)); }
  .print-preview-mode .summary-grid__grandtotal td { font-size: calc(13.5px * var(--print-font-scale, 1)); }
  .print-preview-mode .summary-grid__notenote { font-size: calc(11px * var(--print-font-scale, 1)); }
  .print-preview-mode .cashflow-chart h3 { font-size: calc(14px * var(--print-font-scale, 1)); }
  .print-preview-mode .mini-table { font-size: calc(13px * var(--print-font-scale, 1)); }
  .print-preview-mode .mini-table th { font-size: calc(11px * var(--print-font-scale, 1)); }
  .print-preview-mode .summary-section-header h2 { font-size: calc(17px * var(--print-font-scale, 1)); }
  .print-preview-mode .annual-draw-summary__draw-header label, .print-preview-mode .annual-draw-summary__period { font-size: calc(12px * var(--print-font-scale, 1)); }
  .print-preview-mode .cap-table-summary th { font-size: calc(11px * var(--print-font-scale, 1)); }

  @media print {
    @page { size: landscape; margin: 12mm; }
    /* Same rationale as .print-preview-mode above: force the light palette on paper
       regardless of data-theme. Real printing renders .print-preview-mode's DOM too
       (see buildPrintPages), so this is a belt-and-suspenders match for anyone who
       triggers the browser's native print dialog directly. */
    body {
      background: #fff; font-size: calc(1em * var(--print-font-scale, 1));
      --surface: #ffffff; --page: #ffffff;
      --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
      --border: #e1e0d9; --border-strong: #c3c2b7;
      --danger: #e34948; --good: #0ca30c;
      --banner: #fdf6e3; --banner-border: #eadfb4; --banner-text: #6b5b1e;
      --year-shade: rgba(0, 0, 0, 0.035);
    }
    body.print-grayscale { filter: grayscale(1); }
    button, select, .tabs, .app-topbar, .signed-in-bar, .print-preview-bar, .project-header { display: none !important; }
    .app, .section { max-width: none; padding: 0 !important; margin: 0 !important; }
    /* Real printing reuses the same pre-paginated page boxes as the on-screen preview
       (not native CSS reflow) because break-before on nested/transformed elements is
       unreliable in WebKit/iOS Safari; explicit page-break-after between simple sibling
       boxes is far more broadly supported. */
    .print-real-content { display: none !important; }
    .print-pages { padding: 0 !important; gap: 0 !important; background: #fff !important; }
    .print-pages__toolbar { display: none !important; }
    /* break-after on a flex item is unreliable across engines (notably iOS Safari);
       force plain block flow for print so the forced page breaks actually apply. */
    .print-pages__pages { display: block !important; padding: 0 !important; gap: 0 !important; }
    .print-page-outer { display: block !important; margin: 0 auto !important; }
    .print-page-outer { width: var(--natural-width) !important; height: var(--natural-height) !important; }
    .print-page-outer:not(:last-child) { break-after: page; page-break-after: always; }
    /* @page's own margin already reserves the border band for the header/footer
       running content, so the page box itself should fill just the printable
       (content) area — not simulate its own margin on top of that. */
    /* Absolutely-positioned boxes (used on-screen to simulate a "sheet of paper" and to
       crop overflow) confuse the print engine's own pagination — it can re-fragment their
       content independently of the .print-page-outer break-after boundaries, producing
       phantom extra pages. Real print no longer needs the positioning/clipping at all
       since each page's content is already sized to fit, so fall back to plain flow. */
    .print-page { position: static !important; transform: none !important; box-shadow: none !important; border: none !important; width: 100% !important; height: 100% !important; }
    .print-page__viewport { position: static !important; overflow: visible !important; margin: 0 !important; width: 100% !important; height: 100% !important; }
    .print-page__label { display: none !important; }
    .summary-grid-wrap { overflow: visible !important; max-height: none !important; border: none; }
    .cf-timeline-wrap {
      overflow: visible !important; max-height: none !important;
      width: auto !important; max-width: none !important; border: none;
    }
    .cf-timeline { border: none; box-shadow: none; padding: 0; }
    .cf-heatmap thead th, .cf-heatmap__label { position: static !important; box-shadow: none !important; }
    .summary-grid th, .summary-grid__label, .summary-grid__budget { position: static !important; box-shadow: none !important; }
    .summary-grid th, .summary-grid td { padding: var(--print-row-padding, 5px) 10px; }
    .cashflow-chart, .summary-grid-wrap, .draws-summary { border: none; box-shadow: none; }
    tr { page-break-inside: avoid; }
    .summary-grid { font-size: calc(12.5px * var(--print-font-scale, 1)); }
    .summary-grid__monthnum { font-size: calc(9.5px * var(--print-font-scale, 1)); }
    .summary-grid__grandtotal td { font-size: calc(13.5px * var(--print-font-scale, 1)); }
    .summary-grid__notenote { font-size: calc(11px * var(--print-font-scale, 1)); }
    .cashflow-chart h3 { font-size: calc(14px * var(--print-font-scale, 1)); }
    .mini-table { font-size: calc(13px * var(--print-font-scale, 1)); }
    .mini-table th { font-size: calc(11px * var(--print-font-scale, 1)); }
    .summary-section-header h2 { font-size: calc(17px * var(--print-font-scale, 1)); }
    .annual-draw-summary__draw-header label, .annual-draw-summary__period { font-size: calc(12px * var(--print-font-scale, 1)); }
    .cap-table-summary th { font-size: calc(11px * var(--print-font-scale, 1)); }
  }

  .print-pages { display: flex; flex-direction: column; gap: 12px; padding: 16px 0 48px; background: var(--page); }
  .print-pages__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; }
  .print-pages__hint { color: var(--text-muted); font-size: 12px; margin: 0; }
  .print-pages__zoom { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .print-pages__zoom button { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 8px; cursor: pointer; color: var(--text-primary); }
  .print-pages__zoom span { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .print-pages__pages { display: flex; flex-direction: column; align-items: safe center; gap: 24px; transform-origin: top center; overflow-x: auto; padding: 0 4px; }
  .print-page-outer { position: relative; flex-shrink: 0; overflow: hidden; }
  /* border, not just the box-shadow: the shadow is offset down-right, so on a light
     backdrop (--page is white, same as the page itself, since v0.5's flat theme) the
     top/left edges of the sheet had no visible boundary at all — only a border draws
     all four edges regardless of backdrop color. */
  .print-page { background: #fff; border: 1px solid var(--border-strong); box-shadow: 0 4px 20px rgba(0,0,0,0.18); position: absolute; top: 0; left: 0; }
  .print-page__viewport { overflow: hidden; position: relative; }
  .print-page__content { position: relative; }
  .print-page__label { position: absolute; bottom: 4px; right: 8px; font-size: 10px; color: var(--text-muted); }

  .recurring-draws { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; }
  .recurring-draws__form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; padding: 4px 0 16px; }
  .recurring-draws__form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .recurring-draws__form input, .recurring-draws__form select { min-width: 140px; }
  .recurring-draws__checkbox { flex-direction: row !important; align-items: center; gap: 6px !important; }
  .recurring-draws__checkbox input { min-width: 0; }

  .hamburger-menu { position: relative; }
  .hamburger-menu__btn { font-size: 16px; padding: 4px 10px; line-height: 1; }
  .hamburger-menu__panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 130px; }
  .hamburger-menu__panel .link-button { text-align: left; padding: 6px 8px; width: 100%; }

  .save-btn--dirty { font-weight: 700; color: var(--danger); }

  .export-csv { position: relative; }
  .export-csv__panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 14px 16px; width: 260px; display: flex; flex-direction: column; gap: 8px; }
  .export-csv__title { margin: 0 0 2px; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .export-csv__option { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .export-csv__actions { display: flex; justify-content: space-between; margin-top: 8px; }

  .theme-picker { position: relative; }
  .theme-picker__panel { position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 14px 16px; width: 200px; display: flex; flex-direction: column; gap: 8px; }
  .theme-picker__title { margin: 4px 0 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
  .theme-picker__modes { display: flex; gap: 6px; }
  .theme-picker__mode-btn { flex: 1; background: var(--page); border: 1px solid var(--border); border-radius: 6px; padding: 5px 0; font-size: 12px; cursor: pointer; color: var(--text-primary); }

<script>
  (function () {
    var storedMode = localStorage.getItem("cf-theme-mode");
    if (storedMode && storedMode !== "system") document.documentElement.setAttribute("data-theme", storedMode);
    var isDark = storedMode === "dark" || (storedMode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);

    // Legacy preset-name maps, for browsers that still have the old swatch-picker
    // localStorage keys (pre-custom-color-picker) and haven't run the main script's
    // one-time migration yet — keeps the very first paint from flashing default colors.
    var LEGACY_ACCENT_HEX = { blue: "#2a78d6", green: "#2e9e5b", purple: "#7c5cff", orange: "#c8720a", rose: "#c23b6b", black: "#1a1a1a" };
    var LEGACY_ACTUAL_HEX = { teal: "#0a8f6b", green: "#2e9e5b", blue: "#2a78d6", purple: "#7c5cff", amber: "#c8720a", rose: "#c23b6b" };

    function hexToRgb(hex) {
      var h = hex.replace("#", "");
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var num = parseInt(h, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }
    function applyCustomColor(varName, hex) {
      document.documentElement.style.setProperty(varName, hex);
      var rgb = hexToRgb(hex);
      document.documentElement.style.setProperty(varName + "-bg", "rgba(" + rgb.join(",") + "," + (isDark ? 0.15 : 0.1) + ")");
    }

    var accentColor = localStorage.getItem("cf-theme-accent-color") || LEGACY_ACCENT_HEX[localStorage.getItem("cf-theme-accent")];
    if (accentColor) applyCustomColor("--accent", accentColor);
    var actualColor = localStorage.getItem("cf-theme-actual-color") || LEGACY_ACTUAL_HEX[localStorage.getItem("cf-theme-actual-accent")];
    if (actualColor) applyCustomColor("--actual", actualColor);
  })();
</script>

<script>
(function () {
  "use strict";

  // ---------- state ----------
  var project = null;
  var activeTab = "summary";
  var expandedLineItemId = null;
  var expandedBudgetItemId = null;
  var expandedCashflowLineItemIds = {};
  var expandedMemberId = null;
  var chartCollapsed = true;
  var projectHeaderCollapsed = true;
  // amountMode: "budget" (default), "actual" (hide budget, show only actuals as the
  // primary pill row), or "both" (budget row plus a thin actual sub-row underneath).
  var timelineSettings = {
    cellLength: 22, cellThickness: 12, cellGap: 4, sectionGap: 8,
    scaleBasis: "line", colorScheme: "accent", sensitivity: 2, amountMode: "budget",
  };
  var highlightCurrentMonth = true;
  var cashflowFullWidth = false;
  // "budget" (default), "actual" (hide budget, show only actuals), or "both" (budget row
  // plus a muted actual sub-row underneath).
  var cashflowAmountMode = "budget";
  var cashflowSectionGapPx = 0;
  var cashflowZoomPercent = 100;
  var cashflowShowScheduleRange = true;
  var cfColorMenuState = null;
  var monthNotes = {};
  var summarySectionCollapsed = { drawsList: false, yearly: false, drawReport: false, capTable: false };
  var showDrawGenerator = false;
  var previewMode = false;
  var printSettingsPanelCollapsed = false;
  var printSettings = {
    pageSize: "letter", orientation: "landscape",
    marginTopIn: 0.5, marginRightIn: 0.5, marginBottomIn: 0.5, marginLeftIn: 0.5,
    fontScalePercent: 100, rowSize: "normal", colorMode: "color", repeatHeader: true,
    pageBreakPerSection: true, logoUrl: "",
  };
  var PRINT_SECTION_LABELS = {
    cashflowGraph: "Cashflow Graph", cashflowTable: "Cashflow Table", cashflowTimeline: "Cashflow Timeline",
    yearly: "Budget by Year", drawReport: "Draw Request", capTable: "Cap Table", drawsList: "Draws",
  };
  var PRINT_SECTION_KEYS = ["cashflowGraph", "cashflowTable", "cashflowTimeline", "yearly", "drawReport", "capTable", "drawsList"];
  var printSectionOrder = PRINT_SECTION_KEYS.slice();
  var printSections = { cashflowGraph: true, cashflowTable: true, cashflowTimeline: true, yearly: true, drawReport: true, capTable: true, drawsList: true };
  // The timeline is as wide as the project is long, so it essentially always needs
  // shrinking to fit a page — unlike the other sections, "width" is the useful default.
  var printFit = { cashflowGraph: "none", cashflowTable: "none", cashflowTimeline: "width", yearly: "none", drawReport: "none", capTable: "none", drawsList: "none" };
  var nextIdCounter = 1;

  function genId(prefix) { return prefix + "_" + (nextIdCounter++) + "_" + Math.random().toString(36).slice(2, 7); }

  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("toast--visible");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("toast--visible"); }, 1800);
  }

  // ================= Apps Script API client =================
  var API_URL_KEY = "cf_apps_script_url";
  var API_TOKEN_KEY = "cf_apps_script_token";
  function getApiUrl() { return localStorage.getItem(API_URL_KEY); }
  function setApiUrl(url) { localStorage.setItem(API_URL_KEY, url.trim()); }
  function getApiToken() { return localStorage.getItem(API_TOKEN_KEY) || ""; }
  function setApiToken(token) { localStorage.setItem(API_TOKEN_KEY, token.trim()); }
  function clearApiUrl() { localStorage.removeItem(API_URL_KEY); localStorage.removeItem(API_TOKEN_KEY); }

  // Apps Script web app responses carry no CORS headers, so fetch()/XHR
  // reading the response gets blocked by the browser even though the
  // request executes fine server-side. Neither JSONP (<script> tag) nor a
  // <form>-to-hidden-<iframe> submission are subject to CORS at all, so we
  // use those instead of fetch for every call.
  var __jsonpCounter = 0;
  function jsonpRequest_(url) {
    return new Promise(function (resolve, reject) {
      var cbName = "cf_jsonp_cb_" + Date.now() + "_" + (++__jsonpCounter);
      var script = document.createElement("script");
      var timeout = setTimeout(function () {
        cleanup();
        reject(new Error("Request to Apps Script backend timed out"));
      }, 20000);
      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function (data) {
        cleanup();
        resolve(data);
      };
      script.onerror = function () {
        cleanup();
        reject(new Error("Could not reach the Apps Script backend (check the URL and that the deployment access is \"Anyone\")"));
      };
      script.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "callback=" + cbName;
      document.body.appendChild(script);
    });
  }

  var __formPostCounter = 0;
  function formPostRequest_(url, fields) {
    return new Promise(function (resolve) {
      var suffix = Date.now() + "_" + (++__formPostCounter);
      var iframe = document.createElement("iframe");
      iframe.name = "cf_form_target_" + suffix;
      iframe.style.display = "none";
      document.body.appendChild(iframe);

      var form = document.createElement("form");
      form.method = "POST";
      form.action = url;
      form.target = iframe.name;
      Object.keys(fields).forEach(function (key) {
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = fields[key] == null ? "" : fields[key];
        form.appendChild(input);
      });
      document.body.appendChild(form);

      // We can't read the (cross-origin) iframe's response, so this resolves
      // optimistically once the browser reports the submission completed.
      // Reload the page (or just wait for the next getProject) to confirm.
      iframe.addEventListener("load", function () {
        setTimeout(function () {
          if (form.parentNode) form.parentNode.removeChild(form);
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }, 1000);
        resolve({ ok: true });
      });
      form.submit();
    });
  }

  function throwIfApiError_(json) {
    if (json && json.error) throw new Error(json.error);
    return json;
  }

  function callApi(action, payload) {
    var url = getApiUrl();
    if (!url) return Promise.reject(new Error("No Apps Script Web App URL configured"));
    var token = getApiToken();

    if (action === "getProject" || action === "loadExampleData") {
      var getUrl = url + (url.indexOf("?") === -1 ? "?" : "&") + "action=" + action + (token ? "&token=" + encodeURIComponent(token) : "");
      return jsonpRequest_(getUrl).then(throwIfApiError_);
    }

    if (action === "saveProject") {
      return formPostRequest_(url, {
        action: "saveProject",
        token: token,
        project: JSON.stringify(payload.project),
      });
    }

    return Promise.reject(new Error("Unknown action: " + action));
  }

  var isDirty = false;
  function updateSaveIndicator() {
    var btn = document.getElementById("saveBtn");
    if (btn) {
      btn.textContent = isDirty ? "Save*" : "Save";
      btn.classList.toggle("save-btn--dirty", isDirty);
    }
    var hamburgerBtn = document.getElementById("hamburgerBtn");
    if (hamburgerBtn) hamburgerBtn.classList.toggle("save-btn--dirty", isDirty);
  }
  function persist() {
    isDirty = true;
    updateSaveIndicator();
  }
  function saveNow() {
    showToast("Saving…");
    project.printSettings = printSettings;
    project.printSections = printSections;
    project.printFit = printFit;
    project.printSectionOrder = printSectionOrder;
    project.timelineSettings = timelineSettings;
    project.monthNotes = monthNotes;
    callApi("saveProject", { project: project }).then(function () {
      isDirty = false;
      updateSaveIndicator();
      showToast("Saved");
    }).catch(function (err) {
      showToast("Save failed: " + err.message);
    });
  }
  // Defensive against a backend that hasn't been redeployed with the newer Code.gs yet
  // (an old deployment's getProject() response simply won't have these fields).
  function normalizeProject(p) {
    if (!p.budgetSections) p.budgetSections = [];
    if (!p.budgetItems) p.budgetItems = [];
    if (!p.cashflowCellColors) p.cashflowCellColors = [];
    if (!p.capTableSettings) p.capTableSettings = { prefPercent: 0, startDate: null, endDate: null };
    (p.capTable || []).forEach(function (m) { if (!m.capitalReturns) m.capitalReturns = []; });
    (p.lineItems || []).forEach(function (li) { if (!li.actuals) li.actuals = []; });
    (p.budgetItems || []).forEach(function (bi) { if (!bi.actuals) bi.actuals = []; });
    (p.draws || []).forEach(function (d) {
      if (d.actualDate === undefined) d.actualDate = null;
      if (d.actualAmount === undefined) d.actualAmount = null;
    });
    if (!p.printSettings) p.printSettings = null;
    if (!p.printSections) p.printSections = null;
    if (!p.printFit) p.printFit = null;
    if (!p.printSectionOrder) p.printSectionOrder = null;
    if (!p.timelineSettings) p.timelineSettings = null;
    if (!p.monthNotes) p.monthNotes = {};
    return p;
  }
  function applyLoadedProject(p) {
    project = normalizeProject(p);
    if (project.printSettings) printSettings = Object.assign({}, printSettings, project.printSettings);
    if (project.printSections) printSections = Object.assign({}, printSections, project.printSections);
    if (project.printFit) printFit = Object.assign({}, printFit, project.printFit);
    printSectionOrder = normalizedSectionOrder(project.printSectionOrder);
    if (project.timelineSettings) {
      timelineSettings = Object.assign({}, timelineSettings, project.timelineSettings);
      // Migrate the old boolean (pre-amountMode saves) into the new three-way setting.
      if (project.timelineSettings.amountMode === undefined && project.timelineSettings.showActuals !== undefined) {
        timelineSettings.amountMode = project.timelineSettings.showActuals ? "both" : "budget";
      }
    }
    monthNotes = project.monthNotes || {};
    monthNotesLoadedForId = project.id;
    isDirty = false;
    updateSaveIndicator();
    var isEmpty = project.categories.length === 0 && project.lineItems.length === 0 &&
      project.draws.length === 0 && project.capTable.length === 0;
    if (isEmpty) renderEmptyState();
    else render();
  }
  function loadNow() {
    if (isDirty && !window.confirm("You have unsaved changes. Loading will discard them. Continue?")) return;
    showToast("Loading…");
    callApi("getProject").then(function (p) {
      applyLoadedProject(p);
      showToast("Loaded");
    }).catch(function (err) {
      showToast("Load failed: " + err.message);
    });
  }

  function boot() {
    callApi("getProject").then(function (p) {
      applyLoadedProject(p);
    }).catch(function (err) {
      document.getElementById("bootMessage").textContent = "Failed to load: " + err.message;
    });
  }

  function renderEmptyState() {
    document.getElementById("bootMessage").style.display = "none";
    document.getElementById("tabs").innerHTML = "";
    var el = document.getElementById("tabContent");
    el.innerHTML =
      '<div class="section" style="text-align:center; padding: 48px 16px;">' +
        '<h1 style="margin: 0 0 8px; font-size: 22px;">' + esc(project.name) + '</h1>' +
        '<p class="section__intro" style="margin: 0 auto 20px;">This sheet has no cashflow data yet.</p>' +
        '<div style="display:flex; gap:12px; justify-content:center;">' +
          '<button class="secondary-button" id="startBlankBtn">Start blank</button>' +
          '<button class="secondary-button" id="loadExampleBtn">Load La Costa Hotel example</button>' +
        '</div>' +
      '</div>';
    document.getElementById("startBlankBtn").addEventListener("click", function () { render(); });
    document.getElementById("loadExampleBtn").addEventListener("click", function () {
      el.innerHTML = '<p class="section__intro">Loading example data…</p>';
      callApi("loadExampleData").then(function (p) { applyLoadedProject(p); }).catch(function (err) {
        alert("Failed to load example data: " + err.message);
      });
    });
  }

  // ================= setup gate (API URL, not Google sign-in) =================
  function showSetupGate() {
    document.getElementById("appRoot").style.display = "none";
    var el = document.getElementById("setupGate");
    el.style.display = "";
    el.innerHTML =
      '<div class="setup-gate"><div class="setup-gate__card">' +
        '<h1>Connect your Apps Script backend</h1>' +
        '<p>Paste the Web App URL from your deployed Apps Script project (Deploy &rarr; Manage deployments &rarr; copy the URL ending in <code>/exec</code>). See the repo README for how to set that up.</p>' +
        '<label class="setup-gate__field">Web App URL<input id="apiUrlInput" placeholder="https://script.google.com/macros/s/AKfycb.../exec" value="' + esc(getApiUrl() || "") + '" /></label>' +
        '<label class="setup-gate__field">Shared token (optional, only if you set API_TOKEN)<input id="apiTokenInput" value="' + esc(getApiToken()) + '" /></label>' +
        '<div id="setupError"></div>' +
        '<button class="secondary-button" id="connectBtn">Connect</button>' +
      '</div></div>';
    document.getElementById("connectBtn").addEventListener("click", function () {
      var urlVal = document.getElementById("apiUrlInput").value.trim();
      var tokenVal = document.getElementById("apiTokenInput").value.trim();
      if (!urlVal) return;
      setApiUrl(urlVal);
      setApiToken(tokenVal);
      var btn = document.getElementById("connectBtn");
      btn.disabled = true; btn.textContent = "Connecting…";
      callApi("getProject").then(function () {
        el.style.display = "none";
        document.getElementById("appRoot").style.display = "";
        document.getElementById("connectionLabel").textContent = "Connected: " + urlVal.slice(0, 48) + (urlVal.length > 48 ? "…" : "");
        boot();
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = "Connect";
        document.getElementById("setupError").innerHTML = '<p class="setup-gate__error">' + esc(err.message) + '</p>';
      });
    });
  }

  document.getElementById("changeUrlBtn").addEventListener("click", function () { showSetupGate(); });

  // ---------- formatting ----------
  function fmtMoney(n, cents) {
    if (n == null || isNaN(n)) return "—";
    return n.toLocaleString("en-US", {
      style: "currency", currency: "USD",
      maximumFractionDigits: cents ? 2 : 0, minimumFractionDigits: cents ? 2 : 0,
    });
  }
  function fmtMonth(iso) {
    var p = iso.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, 1)).toLocaleDateString("en-US", { month: "short", year: "numeric", timeZone: "UTC" });
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var p = iso.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function sum(arr) { return arr.reduce(function (a, b) { return a + b; }, 0); }
  function round(n) { return Math.round(n * 10000) / 10000; }
  function round2(n) { return Math.round(n * 100) / 100; }

  // ---------- schedule engine (mirrors backend logic) ----------
  function computeEvenSchedule(startISO, endISO, total) {
    var s = startISO.split("-").map(Number), e = endISO.split("-").map(Number);
    var startKey = s[0] * 12 + (s[1] - 1), endKey = e[0] * 12 + (e[1] - 1);
    if (endKey < startKey) return [];
    var numMonths = endKey - startKey + 1;
    var perMonth = round2(total / numMonths);
    var buckets = [], allocated = 0;
    for (var i = 0; i < numMonths; i++) {
      var isLast = i === numMonths - 1;
