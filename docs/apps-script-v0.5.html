  // ---------- CSV import (Line Items / Budget Items) ----------
  var csvImportState = null; // { kind, headers, rows, mapping, fileName }

  var CSV_IMPORT_FIELDS = {
    lineItems: [
      { key: "category", label: "Category", required: false, aliases: ["category", "cat", "section"] },
      { key: "code", label: "Code", required: false, aliases: ["code", "item code", "line item code"] },
      { key: "description", label: "Description", required: true, aliases: ["description", "desc", "name", "line item", "item"] },
      { key: "totalBudget", label: "Budget", required: false, aliases: ["budget", "total budget", "amount", "total"] },
      { key: "startDate", label: "Start Date", required: false, aliases: ["start date", "start", "startdate"] },
      { key: "endDate", label: "End Date", required: false, aliases: ["end date", "end", "enddate"] },
    ],
    budgetItems: [
      { key: "section", label: "Section", required: false, aliases: ["section", "group", "category"] },
      { key: "description", label: "Description", required: true, aliases: ["description", "desc", "name", "contract", "expense"] },
      { key: "linkedLineItem", label: "Linked Cash Flow Line Item", required: false, aliases: ["linked line item", "line item", "cash flow line", "cashflow line", "link", "code"] },
      { key: "totalBudget", label: "Budget", required: false, aliases: ["budget", "total budget", "amount", "total"] },
      { key: "startDate", label: "Start Date", required: false, aliases: ["start date", "start", "startdate"] },
      { key: "endDate", label: "End Date", required: false, aliases: ["end date", "end", "enddate"] },
    ],
  };

  // Char-by-char CSV parser (handles quoted fields with embedded commas/newlines/escaped quotes).
  function parseCsv(text) {
    var rows = [], row = [], field = "", inQuotes = false, i = 0, len = text.length;
    while (i < len) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c !== ""; }); });
  }

  function normalizeCsvHeader(h) { return String(h || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function autoMapCsvColumns(headers, fieldDefs) {
    var used = {}, mapping = {};
    fieldDefs.forEach(function (fdef) {
      var aliasSet = fdef.aliases.map(normalizeCsvHeader);
      var matchIdx = headers.findIndex(function (h, idx) { return !used[idx] && aliasSet.indexOf(normalizeCsvHeader(h)) !== -1; });
      mapping[fdef.key] = matchIdx !== -1 ? matchIdx : null;
      if (matchIdx !== -1) used[matchIdx] = true;
    });
    return mapping;
  }

  function parseCsvNumber(str) {
    if (!str) return 0;
    var n = Number(String(str).replace(/[$,]/g, "").trim());
    return isNaN(n) ? 0 : n;
  }
  function parseCsvDate(str) {
    if (!str) return null;
    var s = String(str).trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var d = new Date(s);
    if (isNaN(d.getTime())) return null;
    return d.toISOString().slice(0, 10);
  }

  function openCsvImport(kind) {
    csvImportState = { kind: kind, headers: [], rows: [], mapping: {}, fileName: "" };
    renderCsvImportModal();
  }
  function closeCsvImport() {
    csvImportState = null;
    var el = document.getElementById("csvImportOverlay");
    if (el) el.remove();
  }

  function renderCsvImportModal() {
    var existing = document.getElementById("csvImportOverlay");
    if (existing) existing.remove();
    if (!csvImportState) return;

    var overlay = document.createElement("div");
    overlay.id = "csvImportOverlay";
    overlay.className = "modal-overlay";

    var card = document.createElement("div");
    card.className = "modal-card";

    var title = csvImportState.kind === "lineItems" ? "Import Line Items from CSV" : "Import Budget Items from CSV";
    var html = "<h2>" + title + "</h2>";

    if (csvImportState.rows.length === 0) {
      html += '<p class="section__intro">Choose a comma-delimited CSV file. The first row should be column headers.</p>' +
        '<input type="file" id="csvFileInput" accept=".csv,text/csv" />' +
        '<div class="modal-card__actions"><button class="link-button" id="csvImportCancelBtn">Cancel</button></div>';
    } else {
      var fieldDefs = CSV_IMPORT_FIELDS[csvImportState.kind];
      html += '<p class="section__intro">' + esc(csvImportState.fileName) + " — " + csvImportState.rows.length + " row" + (csvImportState.rows.length === 1 ? "" : "s") +
        ". Map each field below to a column from your CSV, then import.</p>";
      html += '<table class="mini-table csv-import-mapping"><thead><tr><th>Field</th><th>CSV column</th></tr></thead><tbody>';
      fieldDefs.forEach(function (fdef) {
        html += "<tr><td>" + esc(fdef.label) + (fdef.required ? " *" : "") + '</td><td><select data-csv-map-field="' + fdef.key + '">' +
          '<option value="">— skip —</option>' +
          csvImportState.headers.map(function (h, idx) {
            return '<option value="' + idx + '"' + (csvImportState.mapping[fdef.key] === idx ? " selected" : "") + ">" + esc(h) + "</option>";
          }).join("") +
          "</select></td></tr>";
      });
      html += "</tbody></table>";

      html += '<h3 style="margin-top:16px;">Preview (first 3 rows)</h3>';
      html += '<div style="overflow:auto;max-height:200px;"><table class="mini-table"><thead><tr>' +
        fieldDefs.map(function (fdef) { return "<th>" + esc(fdef.label) + "</th>"; }).join("") +
        "</tr></thead><tbody>";
      csvImportState.rows.slice(0, 3).forEach(function (row) {
        html += "<tr>" + fieldDefs.map(function (fdef) {
          var idx = csvImportState.mapping[fdef.key];
          return "<td>" + (idx == null ? "" : esc(row[idx] || "")) + "</td>";
        }).join("") + "</tr>";
      });
      html += "</tbody></table></div>";

      html += '<div class="modal-card__actions">' +
        '<button class="secondary-button" id="csvImportCommitBtn">Import ' + csvImportState.rows.length + " row" + (csvImportState.rows.length === 1 ? "" : "s") + "</button>" +
        '<button class="link-button" id="csvImportCancelBtn">Cancel</button>' +
        "</div>";
    }

    card.innerHTML = html;
    overlay.appendChild(card);
    document.body.appendChild(overlay);

    var fileInput = document.getElementById("csvFileInput");
    if (fileInput) {
      fileInput.addEventListener("change", function () {
        var file = fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var parsed = parseCsv(String(reader.result));
          if (parsed.length < 1) { alert("Could not find any rows in that file."); return; }
          csvImportState.headers = parsed[0];
          csvImportState.rows = parsed.slice(1);
          csvImportState.fileName = file.name;
          csvImportState.mapping = autoMapCsvColumns(csvImportState.headers, CSV_IMPORT_FIELDS[csvImportState.kind]);
          renderCsvImportModal();
        };
        reader.readAsText(file);
      });
    }
    document.querySelectorAll("[data-csv-map-field]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        csvImportState.mapping[sel.getAttribute("data-csv-map-field")] = sel.value === "" ? null : Number(sel.value);
      });
    });
    var cancelBtn = document.getElementById("csvImportCancelBtn");
    if (cancelBtn) cancelBtn.addEventListener("click", closeCsvImport);
    var commitBtn = document.getElementById("csvImportCommitBtn");
    if (commitBtn) commitBtn.addEventListener("click", commitCsvImport);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeCsvImport(); });
  }

  function commitCsvImport() {
    var state = csvImportState;
    if (!state) return;
    var mapping = state.mapping;
    var cell = function (row, key) { var idx = mapping[key]; return idx == null ? "" : (row[idx] || "").trim(); };

    if (state.kind === "lineItems") {
      var catByName = {};
      project.categories.forEach(function (c) { catByName[c.name.toLowerCase()] = c.id; });
      var imported = 0, skipped = 0, newCats = 0;
      state.rows.forEach(function (row) {
        var description = cell(row, "description");
        if (!description) { skipped++; return; }
        var catName = cell(row, "category");
        var categoryId = null;
        if (catName) {
          var key = catName.toLowerCase();
          if (catByName[key]) categoryId = catByName[key];
          else {
            categoryId = genId("cat");
            project.categories.push({ id: categoryId, name: catName, sortOrder: project.categories.length });
            catByName[key] = categoryId;
            newCats++;
          }
        }
        project.lineItems.push({
          id: genId("li"), categoryId: categoryId, code: cell(row, "code"), description: description,
          totalBudget: parseCsvNumber(cell(row, "totalBudget")), scheduleMode: "EVEN",
          startDate: parseCsvDate(cell(row, "startDate")), endDate: parseCsvDate(cell(row, "endDate")),
          sortOrder: project.lineItems.length, payments: [], actuals: [], color: null,
        });
        imported++;
      });
      closeCsvImport();
      render();
      persist();
      showToast("Imported " + imported + " line item" + (imported === 1 ? "" : "s") +
        (skipped ? ", " + skipped + " skipped (no description)" : "") +
        (newCats ? ", " + newCats + " new categor" + (newCats === 1 ? "y" : "ies") : ""));
    } else {
      var secByName = {};
      project.budgetSections.forEach(function (s) { secByName[s.name.toLowerCase()] = s.id; });
      var importedB = 0, skippedB = 0, newSecs = 0, unmatched = 0;
      state.rows.forEach(function (row) {
        var description = cell(row, "description");
        if (!description) { skippedB++; return; }
        var secName = cell(row, "section");
        var sectionId = null;
        if (secName) {
          var key = secName.toLowerCase();
          if (secByName[key]) sectionId = secByName[key];
          else {
            sectionId = genId("bsec");
            project.budgetSections.push({ id: sectionId, name: secName, sortOrder: project.budgetSections.length });
            secByName[key] = sectionId;
            newSecs++;
          }
        }
        var linkText = cell(row, "linkedLineItem");
        var linkedLineItemId = null;
        if (linkText) {
          var lt = linkText.toLowerCase();
          var match = project.lineItems.filter(function (li) { return (li.code || "").toLowerCase() === lt; })[0] ||
            project.lineItems.filter(function (li) { return li.description.toLowerCase() === lt; })[0];
          if (match) linkedLineItemId = match.id;
          else unmatched++;
        }
        project.budgetItems.push({
          id: genId("bi"), sectionId: sectionId, description: description, linkedLineItemId: linkedLineItemId,
          totalBudget: parseCsvNumber(cell(row, "totalBudget")), scheduleMode: "EVEN",
          startDate: parseCsvDate(cell(row, "startDate")), endDate: parseCsvDate(cell(row, "endDate")),
          sortOrder: project.budgetItems.length, payments: [], actuals: [],
        });
        importedB++;
      });
      closeCsvImport();
      render();
      persist();
      showToast("Imported " + importedB + " budget item" + (importedB === 1 ? "" : "s") +
        (skippedB ? ", " + skippedB + " skipped (no description)" : "") +
        (unmatched ? ", " + unmatched + " unlinked (no matching line item)" : "") +
        (newSecs ? ", " + newSecs + " new section" + (newSecs === 1 ? "" : "s") : ""));
    }
  }

      }

        var intervalChoice = Number(intervalSelect.value);
        var intervalMonths = intervalChoice === 0 ? Math.max(1, Number(wrap.querySelector("#genCustomMonths").value) || 1) : intervalChoice;
        var count = Math.max(1, Number(wrap.querySelector("#genCount").value) || 1);
        var entries = generateRecurringDraws({
          startDate: wrap.querySelector("#genStartDate").value,
          intervalMonths: intervalMonths,
          count: count,
          totalAmount: Number(wrap.querySelector("#genTotalAmount").value) || 0,
          splitEvenly: splitCheckbox.checked,
          namePrefix: wrap.querySelector("#genNamePrefix").value || "Draw",
          source: wrap.querySelector("#genSource").value || "",
          startIndex: project.draws.length + 1,
        });
        entries.forEach(function (e) {
          project.draws.push({ id: genId("draw"), name: e.name, date: e.date, amount: e.amount, source: e.source, sortOrder: project.draws.length, actualDate: null, actualAmount: null });
        });
        showDrawGenerator = false;
        render();
        persist();
      });
    }

  function findMember(id) { return project.capTable.filter(function (m) { return m.id === id; })[0]; }

  function wireCapTableEvents(root, summary) {
    root.querySelectorAll("[data-member-field]").forEach(function (input) {
      input.addEventListener("change", function () {
        var member = findMember(input.getAttribute("data-member-id"));
        var field = input.getAttribute("data-member-field");
        if (field === "ownershipPercent") member[field] = input.value === "" ? null : Number(input.value);
        else member[field] = input.value;
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-member-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-member-delete");
        var m = findMember(id);
        if (confirm('Remove "' + m.name + '" from the cap table?')) {
          project.capTable = project.capTable.filter(function (x) { return x.id !== id; });
          render();
          persist();
        }
      });
    });
    root.querySelectorAll("[data-toggle-ledger]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-toggle-ledger");
        expandedMemberId = expandedMemberId === id ? null : id;
        render();
      });
    });
    var addMemberBtn = root.querySelector("#addMemberBtn");
    if (addMemberBtn) addMemberBtn.addEventListener("click", function () {
      project.capTable.push({ id: genId("member"), name: "Member " + (project.capTable.length + 1), role: "LP", ownershipPercent: null, sortOrder: project.capTable.length, contributions: [], distributions: [], capitalReturns: [] });
      render();
      persist();
    });
    root.querySelectorAll("[data-add-contribution]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add-contribution");
        var dateInput = root.querySelector('[data-new-contribution-date="' + id + '"]');
        var amountInput = root.querySelector('[data-new-contribution-amount="' + id + '"]');
        var noteInput = root.querySelector('[data-new-contribution-note="' + id + '"]');
        if (!amountInput.value) return;
        findMember(id).contributions.push({ id: genId("contrib"), date: dateInput.value || new Date().toISOString().slice(0, 10), amount: Number(amountInput.value), note: noteInput.value || "" });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-remove-contribution]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-remove-contribution").split("|");
        var m = findMember(parts[0]);
        m.contributions = m.contributions.filter(function (c) { return c.id !== parts[1]; });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-add-distribution]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add-distribution");
        var dateInput = root.querySelector('[data-new-distribution-date="' + id + '"]');
        var amountInput = root.querySelector('[data-new-distribution-amount="' + id + '"]');
        var noteInput = root.querySelector('[data-new-distribution-note="' + id + '"]');
        if (!amountInput.value) return;
        findMember(id).distributions.push({ id: genId("dist"), date: dateInput.value || new Date().toISOString().slice(0, 10), amount: Number(amountInput.value), note: noteInput.value || "" });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-remove-distribution]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-remove-distribution").split("|");
        var m = findMember(parts[0]);
        m.distributions = m.distributions.filter(function (d) { return d.id !== parts[1]; });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-add-capitalreturn]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add-capitalreturn");
        var dateInput = root.querySelector('[data-new-capitalreturn-date="' + id + '"]');
        var amountInput = root.querySelector('[data-new-capitalreturn-amount="' + id + '"]');
        var noteInput = root.querySelector('[data-new-capitalreturn-note="' + id + '"]');
        if (!amountInput.value) return;
        var m = findMember(id);
        if (!m.capitalReturns) m.capitalReturns = [];
        m.capitalReturns.push({ id: genId("capret"), date: dateInput.value || new Date().toISOString().slice(0, 10), amount: Number(amountInput.value), note: noteInput.value || "" });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-remove-capitalreturn]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-remove-capitalreturn").split("|");
        var m = findMember(parts[0]);
        m.capitalReturns = m.capitalReturns.filter(function (r) { return r.id !== parts[1]; });
        render();
        persist();
      });
    });
    var splitBtn = root.querySelector("#splitBtn");
    if (splitBtn) splitBtn.addEventListener("click", function () {
      var date = root.querySelector("#splitDate").value;
      var amount = Number(root.querySelector("#splitAmount").value);
      if (!amount || amount <= 0) return;
      var splits = autoSplitAmount(summary.capTable, amount);
      splits.forEach(function (s) {

        findMember(s.memberId).distributions.push({ id: genId("dist"), date: date, amount: s.amount, note: "Auto-split distribution" });
      });
      render();
      persist();
    });
  }

  // ---------- theme picker ----------
  var THEME_MODES = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];
  var LEGACY_ACCENT_HEX = { blue: "#2a78d6", green: "#2e9e5b", purple: "#7c5cff", orange: "#c8720a", rose: "#c23b6b", black: "#1a1a1a" };
  var LEGACY_ACTUAL_HEX = { teal: "#0a8f6b", green: "#2e9e5b", blue: "#2a78d6", purple: "#7c5cff", amber: "#c8720a", rose: "#c23b6b" };
  var DEFAULT_ACCENT_HEX = "#2a78d6";
  var DEFAULT_ACTUAL_HEX = "#0a8f6b";
  function getThemeMode() { return localStorage.getItem("cf-theme-mode") || "system"; }
  function hexToRgb(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var num = parseInt(h, 16);
    return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
  }
  function isThemeDarkEffective() {
    var attr = document.documentElement.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  // Migrates the old swatch-picker's preset-name localStorage key (if present and
  // no custom-color key has been set yet) into the new hex-based key, once.
  function migrateLegacyColorKey(newKey, oldKey, presetMap) {
    if (localStorage.getItem(newKey)) return;
    var legacy = localStorage.getItem(oldKey);
    if (legacy && presetMap[legacy]) localStorage.setItem(newKey, presetMap[legacy]);
    if (legacy) localStorage.removeItem(oldKey);
  }
  function getThemeAccentColor() {
    migrateLegacyColorKey("cf-theme-accent-color", "cf-theme-accent", LEGACY_ACCENT_HEX);
    return localStorage.getItem("cf-theme-accent-color");
  }
  function getThemeActualColor() {
    migrateLegacyColorKey("cf-theme-actual-color", "cf-theme-actual-accent", LEGACY_ACTUAL_HEX);
    return localStorage.getItem("cf-theme-actual-color");
  }
  function applyCustomColor(varName, hex) {
    document.documentElement.style.setProperty(varName, hex);
    var rgb = hexToRgb(hex);
    document.documentElement.style.setProperty(varName + "-bg", "rgba(" + rgb.join(",") + "," + (isThemeDarkEffective() ? 0.15 : 0.1) + ")");
  }
  function clearCustomColor(varName) {
    document.documentElement.style.removeProperty(varName);
    document.documentElement.style.removeProperty(varName + "-bg");
  }
  function refreshCustomColors() {
    var accent = getThemeAccentColor();
    if (accent) applyCustomColor("--accent", accent);
    var actual = getThemeActualColor();
    if (actual) applyCustomColor("--actual", actual);
  }
  function setThemeMode(mode) {
    localStorage.setItem("cf-theme-mode", mode);
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    refreshCustomColors();
  }
  function setThemeAccentColor(hex) {
    localStorage.setItem("cf-theme-accent-color", hex);
    applyCustomColor("--accent", hex);
  }
  function setThemeActualColor(hex) {
    localStorage.setItem("cf-theme-actual-color", hex);
    applyCustomColor("--actual", hex);
  }
  function resetThemeAccentColor() {
    localStorage.removeItem("cf-theme-accent-color");
    clearCustomColor("--accent");
  }
  function resetThemeActualColor() {
    localStorage.removeItem("cf-theme-actual-color");
    clearCustomColor("--actual");
  }
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (getThemeMode() === "system") refreshCustomColors();
    });
  }
  function renderThemePanel() {
    var panel = document.getElementById("themePickerPanel");
    var mode = getThemeMode();
    var accent = getThemeAccentColor(), actualColor = getThemeActualColor();
    var html = '<p class="theme-picker__title">Mode</p><div class="theme-picker__modes">';
    THEME_MODES.forEach(function (m) {
      html += '<button class="theme-picker__mode-btn' + (mode === m[0] ? " theme-picker__mode-btn--active" : "") + '" data-mode="' + m[0] + '">' + m[1] + "</button>";
    });
    html += '</div><p class="theme-picker__title">Accent color</p><div class="theme-picker__color-row">' +
      '<input type="color" id="accentColorInput" value="' + (accent || DEFAULT_ACCENT_HEX) + '" />' +
      (accent ? '<button class="theme-picker__color-reset" id="accentColorReset">Reset</button>' : "") +
      '</div><p class="theme-picker__title">Actuals color</p><div class="theme-picker__color-row">' +
      '<input type="color" id="actualColorInput" value="' + (actualColor || DEFAULT_ACTUAL_HEX) + '" />' +
      (actualColor ? '<button class="theme-picker__color-reset" id="actualColorReset">Reset</button>' : "") +
      "</div>";
    panel.innerHTML = html;
    panel.querySelectorAll("[data-mode]").forEach(function (btn) {
      btn.addEventListener("click", function () { setThemeMode(btn.getAttribute("data-mode")); renderThemePanel(); });
    });
    panel.querySelector("#accentColorInput").addEventListener("input", function (e) { setThemeAccentColor(e.target.value); });
    panel.querySelector("#accentColorInput").addEventListener("change", function () { renderThemePanel(); });
    panel.querySelector("#actualColorInput").addEventListener("input", function (e) { setThemeActualColor(e.target.value); });
    panel.querySelector("#actualColorInput").addEventListener("change", function () { renderThemePanel(); });
    var accentReset = panel.querySelector("#accentColorReset");
    if (accentReset) accentReset.addEventListener("click", function () { resetThemeAccentColor(); renderThemePanel(); });
    var actualReset = panel.querySelector("#actualColorReset");
    if (actualReset) actualReset.addEventListener("click", function () { resetThemeActualColor(); renderThemePanel(); });
  }
  document.getElementById("themePickerBtn").addEventListener("click", function () {
    var panel = document.getElementById("themePickerPanel");
    var isOpen = panel.style.display !== "none";
    if (isOpen) { panel.style.display = "none"; return; }
    renderThemePanel();
    panel.style.display = "flex";
  });

  function renderExportPanel() {

      html += '<label class="export-csv__option"><input type="checkbox" data-export-section="' + s + '" ' + (exportSections[s] ? "checked" : "") + " />" + esc(EXPORT_SECTION_LABELS[s]) + "</label>";
    });
    html += '<div class="export-csv__actions"><button class="link-button" id="exportCancelBtn">Cancel</button><button class="secondary-button" id="exportDownloadBtn">Download CSV</button></div>';
    panel.innerHTML = html;
    panel.querySelectorAll("[data-export-section]").forEach(function (cb) {
      cb.addEventListener("change", function () { exportSections[cb.getAttribute("data-export-section")] = cb.checked; });
    });
    panel.querySelector("#exportCancelBtn").addEventListener("click", function () { panel.style.display = "none"; });
    panel.querySelector("#exportDownloadBtn").addEventListener("click", function () {
      var sections = EXPORT_SECTION_ORDER.filter(function (s) { return exportSections[s]; });
      var summary = buildSummary(project);
      var csv = buildCombinedCsv(project, summary, sections);
      var safeName = project.name.replace(/[^a-z0-9 -]/gi, "").trim() || "project";
      downloadCsv(safeName + " - cashflow export.csv", csv);
      panel.style.display = "none";
    });
  }
  document.getElementById("exportCsvBtn").addEventListener("click", function () {
    var panel = document.getElementById("exportCsvPanel");
    var isOpen = panel.style.display !== "none";
    if (isOpen) { panel.style.display = "none"; return; }
    renderExportPanel();
    panel.style.display = "flex";
  });

  // ---------- hamburger menu ----------
  document.getElementById("hamburgerBtn").addEventListener("click", function () {
    var panel = document.getElementById("hamburgerPanel");
    panel.style.display = panel.style.display === "none" ? "flex" : "none";
  });

  // ---------- save / load ----------
  document.getElementById("saveBtn").addEventListener("click", function () { saveNow(); });
  document.getElementById("loadBtn").addEventListener("click", function () { loadNow(); });
  window.addEventListener("beforeunload", function (e) {
    if (!isDirty) return;
    e.preventDefault();
    e.returnValue = "";
  });

  // ---------- cashflow cell selection (global listeners, wired once) ----------
  document.addEventListener("mouseup", function () { cfSelecting = false; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && cfSelection.length) cfClearSelection(document.querySelector("table.summary-grid"));
  });

  // ---------- print ----------
  var printGeneratedAt = null;
  function cssContentString(s) {
    return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
  }
  function applyPrintSettingsToDom() {
    document.body.classList.toggle("print-grayscale", printSettings.colorMode === "grayscale");
    document.body.classList.toggle("pp-section-breaks", printSettings.pageBreakPerSection);
    document.body.style.setProperty("--print-font-scale", String(printSettings.fontScalePercent / 100));
    document.body.style.setProperty("--print-row-padding", ROW_PADDING_PX[printSettings.rowSize] + "px");
    var styleEl = document.getElementById("dynamic-print-page");
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = "dynamic-print-page";
      document.head.appendChild(styleEl);
    }
    var headerLeft = cssContentString(project ? project.name : "");
    var footerLeft = cssContentString("Generated " + (printGeneratedAt ? printGeneratedAt.toLocaleString() : ""));
    var topRight = printSettings.logoUrl
      ? " @top-right { content: url(" + cssContentString(printSettings.logoUrl) + "); }"
      : "";
    styleEl.textContent =
      "@page { size: " + pageCssSize(printSettings) + "; margin: " + marginCss(printSettings) + ";" +
      " @top-left { content: " + headerLeft + "; font-size: 9px; font-weight: 700; color: #333; }" +
      topRight +
      " @bottom-left { content: " + footerLeft + "; font-size: 8px; color: #666; }" +
      ' @bottom-right { content: "Page " counter(page) " of " counter(pages); font-size: 8px; color: #666; }' +
      " }";
  }
  function updateSettingsPanelToggle() {
    var panel = document.getElementById("ppSettingsPanel");
    var bar = document.getElementById("printPreviewBar");
    // The drawer is fixed, so it needs the bar's height as its top offset; reading it
    // each time keeps it correct if the bar ever wraps to two rows.
    panel.style.top = Math.round(bar.getBoundingClientRect().height) + "px";
    document.body.classList.toggle("pp-panel-open", previewMode && !printSettingsPanelCollapsed);
    document.body.classList.toggle("pp-panel-closed", printSettingsPanelCollapsed);
    document.getElementById("ppSettingsToggleBtn").textContent =
      (printSettingsPanelCollapsed ? "‹" : "›") + " Settings";
  }
  function syncPrintPanelFromState() {
    document.getElementById("ppPageSize").value = printSettings.pageSize;
    document.getElementById("ppOrientation").value = printSettings.orientation;
    document.getElementById("ppMarginTop").value = printSettings.marginTopIn;
    document.getElementById("ppMarginRight").value = printSettings.marginRightIn;
    document.getElementById("ppMarginBottom").value = printSettings.marginBottomIn;
    document.getElementById("ppMarginLeft").value = printSettings.marginLeftIn;
    document.getElementById("ppFontScale").value = printSettings.fontScalePercent;
    document.getElementById("ppRowSize").value = printSettings.rowSize;
    document.getElementById("ppColorMode").value = printSettings.colorMode;
    document.getElementById("ppRepeatHeader").checked = printSettings.repeatHeader;
    document.getElementById("ppPageBreakSections").checked = printSettings.pageBreakPerSection;
    document.getElementById("ppLogoUrl").value = printSettings.logoUrl;
    renderPrintSectionsList();
  }

  // Any key missing from a stored order (older save, or a section added in a later
  // version) is appended in its canonical position rather than silently dropped.
  function normalizedSectionOrder(order) {
    var seen = {};
    var out = (order || []).filter(function (k) {
      if (seen[k] || !PRINT_SECTION_LABELS[k]) return false;
      seen[k] = true;
      return true;
    });
    PRINT_SECTION_KEYS.forEach(function (k) { if (!seen[k]) out.push(k); });
    return out;
  }

  function renderPrintSectionsList() {
    var host = document.getElementById("ppSectionsList");
    if (!host) return;
    printSectionOrder = normalizedSectionOrder(printSectionOrder);
    host.innerHTML = printSectionOrder.map(function (key, i) {
      var on = !!printSections[key];
      return '<div class="pp-section-row' + (on ? "" : " pp-section-row--off") + '">' +
        '<span class="pp-section-row__move">' +
          '<button type="button" data-pp-move="up" data-pp-key="' + key + '" title="Move up"' + (i === 0 ? " disabled" : "") + ">↑</button>" +
          '<button type="button" data-pp-move="down" data-pp-key="' + key + '" title="Move down"' + (i === printSectionOrder.length - 1 ? " disabled" : "") + ">↓</button>" +
        "</span>" +
        '<label class="pp-section-row__name">' +
          '<span class="pp-section-row__ord">' + (i + 1) + "</span>" +
          '<input type="checkbox" data-pp-toggle="' + key + '"' + (on ? " checked" : "") + " /> " +
          esc(PRINT_SECTION_LABELS[key]) +
        "</label>" +
        '<select data-pp-fit="' + key + '">' +
          ["none", "width", "height"].map(function (m) {
            return '<option value="' + m + '"' + (printFit[key] === m ? " selected" : "") + ">" +
              (m === "none" ? "No fit" : m === "width" ? "Fit width" : "Fit height") + "</option>";
          }).join("") +
        "</select>" +
      "</div>";
    }).join("");

    host.querySelectorAll("[data-pp-move]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-pp-key");
        var dir = btn.getAttribute("data-pp-move") === "up" ? -1 : 1;
        var i = printSectionOrder.indexOf(key);
        var j = i + dir;
        if (i < 0 || j < 0 || j >= printSectionOrder.length) return;
        printSectionOrder.splice(j, 0, printSectionOrder.splice(i, 1)[0]);
        persist();
        render();
        renderPrintSectionsList();
      });
    });
    host.querySelectorAll("[data-pp-toggle]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        printSections[cb.getAttribute("data-pp-toggle")] = cb.checked;
        persist();
        render();
        renderPrintSectionsList();
      });
    });
    host.querySelectorAll("[data-pp-fit]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        printFit[sel.getAttribute("data-pp-fit")] = sel.value;
        persist();
        render();
      });
    });
  }
  function setPreviewMode(on) {
    previewMode = on;
    if (on) printGeneratedAt = new Date();
    document.body.classList.toggle("print-preview-mode", on);
    document.getElementById("printPreviewBar").style.display = on ? "flex" : "none";
    if (on) { syncPrintPanelFromState(); applyPrintSettingsToDom(); }
    // Runs on exit too, so the drawer's body classes (and the page padding they add)
    // don't linger once the preview is closed. Before render() so the auto-fit zoom
    // measures against the width the drawer actually leaves free.
    updateSettingsPanelToggle();
    render();
  }
  document.getElementById("printBtn").addEventListener("click", function () {
    setPreviewMode(true);
  });
  document.getElementById("ppExitBtn").addEventListener("click", function () {
    setPreviewMode(false);
  });
  document.getElementById("ppPrintBtn").addEventListener("click", function () {
    window.print();
  });
  document.getElementById("ppPdfBtn").addEventListener("click", function () { exportPdf(); });
  function togglePrintSettingsPanel(collapsed) {
    printSettingsPanelCollapsed = collapsed;
    updateSettingsPanelToggle();
    // Opening or closing changes the width left for the pages, so an auto-fit zoom
    // needs recomputing.
    if (previewMode) render();
  }
  document.getElementById("ppSettingsToggleBtn").addEventListener("click", function () {
    togglePrintSettingsPanel(!printSettingsPanelCollapsed);
  });
  document.getElementById("ppPanelCloseBtn").addEventListener("click", function () {
    togglePrintSettingsPanel(true);
  });
  document.getElementById("ppPageSize").addEventListener("change", function (e) {
    printSettings.pageSize = e.target.value;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppOrientation").addEventListener("change", function (e) {
    printSettings.orientation = e.target.value;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppMarginTop").addEventListener("change", function (e) {
    printSettings.marginTopIn = Number(e.target.value) || 0;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppMarginRight").addEventListener("change", function (e) {
    printSettings.marginRightIn = Number(e.target.value) || 0;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppMarginBottom").addEventListener("change", function (e) {
    printSettings.marginBottomIn = Number(e.target.value) || 0;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppMarginLeft").addEventListener("change", function (e) {
    printSettings.marginLeftIn = Number(e.target.value) || 0;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppRepeatHeader").addEventListener("change", function (e) {
    printSettings.repeatHeader = e.target.checked;
    persist();
    render();
  });
  document.getElementById("ppPageBreakSections").addEventListener("change", function (e) {
    printSettings.pageBreakPerSection = e.target.checked;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppLogoUrl").addEventListener("change", function (e) {
    printSettings.logoUrl = e.target.value.trim();
    persist();
    applyPrintSettingsToDom();
    render();
  });
  // The bar is static markup that render() never rebuilds, so a class toggle here
  // survives every re-render without needing its own state.
  document.querySelectorAll(".pp-group__toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var group = btn.closest(".pp-group");
      var collapsed = group.classList.toggle("pp-group--collapsed");
      btn.textContent = collapsed ? "▸" : "▾";
    });
  });
  document.getElementById("ppResetOrder").addEventListener("click", function () {
    printSectionOrder = PRINT_SECTION_KEYS.slice();
    persist();
    render();
    renderPrintSectionsList();
  });
  document.getElementById("ppFontScale").addEventListener("change", function (e) {
    printSettings.fontScalePercent = Math.max(50, Math.min(200, Number(e.target.value) || 100));
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppRowSize").addEventListener("change", function (e) {
    printSettings.rowSize = e.target.value;
    persist();
    applyPrintSettingsToDom();
    render();
  });
  document.getElementById("ppColorMode").addEventListener("change", function (e) {
    printSettings.colorMode = e.target.value;
    persist();
    applyPrintSettingsToDom();
    render();
  });

  if (getApiUrl()) {
    document.getElementById("connectionLabel").textContent = "Connected: " + getApiUrl().slice(0, 48) + (getApiUrl().length > 48 ? "…" : "");
    document.getElementById("appRoot").style.display = "";
    boot();
  } else {
    showSetupGate();
  }
})();
</script>
</body>
</html>
