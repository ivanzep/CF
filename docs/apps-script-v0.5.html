        var chunkTableHtml = '<table class="' + table.className + '" style="' +
          esc(table.getAttribute("style") || "") + "table-layout:fixed;width:" + chunkWidth + 'px;">' +
          "<colgroup>" + idxs.map(function (i) { return '<col style="width:' + colWidths[i] + 'px">'; }).join("") + "</colgroup>" +
          theadHtml + tbodyHtml + "</table>";

        var bodyHtml = (chunkIndex === 0 ? preambleHtml : "") + (tableWrapper ? '<div class="' + tableWrapper.className + '">' + chunkTableHtml + "</div>" : chunkTableHtml);
        var unscaledHeight = chunkIndex === 0 ? sectionHeight : tableHeight;
        var scaledHeight = unscaledHeight * factor;
        var html =
          '<div style="width:' + Math.ceil(chunkWidth * factor) + "px;height:" + Math.ceil(scaledHeight) + 'px;overflow:hidden;">' +
            '<div class="' + section.className + '" style="width:' + chunkWidth + "px;transform:scale(" + factor + ");transform-origin:top left;\">" +
              bodyHtml +
            "</div>" +
          "</div>";

        units.push({ type: "atomic", html: html, height: scaledHeight, sectionStart: chunkIndex === 0, forceNewPage: chunkIndex > 0 });
      });
    }

    // An unscaled table wider than the printable area would simply be cropped at the
    // margin. Split it into column chunks that continue on following pages instead —
    // as table runs, so long tables still paginate vertically within each chunk.
    function pushWideTableRuns(section, table) {
      var theadEl = table.querySelector("thead");
      var bodyEl = table.querySelector("tbody");
      var bodyRows = bodyEl ? Array.from(bodyEl.children) : [];
      var colWidths = measureColWidths(table);
      if (!theadEl || bodyRows.length === 0 || colWidths.length === 0) {
        units.push({ type: "atomic", html: section.outerHTML, height: outerHeight(section), sectionStart: true });
        return;
      }
      var tableWrapper = Array.from(section.children).filter(function (c) { return isTableWrapper(c); })[0];
      var preamble = Array.from(section.children).filter(function (c) { return c !== table && c !== tableWrapper; });
      var FROZEN = Math.min(2, colWidths.length);
      var chunks = columnChunks(colWidths, FROZEN, dims.contentWidthPx, 1);
      var isFirstUnit = true;

      preamble.forEach(function (node) {
        units.push({ type: "atomic", html: node.outerHTML, height: outerHeight(node), sectionStart: isFirstUnit });
        isFirstUnit = false;
      });

      chunks.forEach(function (dataIdxs, chunkIndex) {
        var sel = chunkIndexSet(dataIdxs, FROZEN);
        var run = {
          runId: "run" + (runCounter++),
          tableClassName: table.className,
          tableStyle: table.getAttribute("style") || "",
          wrapperClassName: tableWrapper ? tableWrapper.className : null,
          colgroupHtml: "<colgroup>" + sel.idxs.map(function (i) { return '<col style="width:' + colWidths[i] + 'px">'; }).join("") + "</colgroup>",
          totalWidth: sel.idxs.reduce(function (a, i) { return a + colWidths[i]; }, 0),
          theadHtml: sliceTheadHtml(theadEl, sel.inSet),
          theadHeight: theadEl.offsetHeight,
          firstPageDone: false,
        };
        bodyRows.forEach(function (tr, rowIndex) {
          units.push({
            type: "row", run: run, html: sliceRowHtml(tr, sel.inSet), height: tr.offsetHeight,
            sectionStart: isFirstUnit && chunkIndex === 0 && rowIndex === 0,
            forceNewPage: chunkIndex > 0 && rowIndex === 0,
          });
        });
        if (chunkIndex === 0) isFirstUnit = false;
      });
    }

    Array.from(measureClone.querySelectorAll(".print-fit-section")).forEach(function (section) {
      if (section.getAttribute("data-fit-chunk") === "1") {
        pushFitHeightChunks(section);
        return;
      }
      // Fit-scaled sections (transform:scale applied by applyFitScaling) keep their old
      // all-or-nothing placement: splitting a scaled section into fresh per-row table
      // fragments would silently drop the scaling, since the transform lives on the
      // section wrapper, not on the individual rows/tables inside it.
      if (section.style.transform) {
        var sizer = section.parentElement && section.parentElement.children.length === 1 ? section.parentElement : section;
        units.push({ type: "atomic", html: sizer.outerHTML, height: outerHeight(sizer), sectionStart: true });
        return;
      }
      var ownTable = section.querySelector("table");
      if (ownTable && ownTable.offsetWidth > dims.contentWidthPx + 0.5) {
        pushWideTableRuns(section, ownTable);
        return;
      }
      var entries = Array.from(section.children).map(function (child) {
        if (child.tagName === "TABLE") return { kind: "table", table: child, wrapperClassName: null, node: child };
        if (isTableWrapper(child)) return { kind: "table", table: child.children[0], wrapperClassName: child.className, node: child };
        return { kind: "atomic", node: child };
      });
      if (!entries.some(function (e) { return e.kind === "table"; })) {
        units.push({ type: "atomic", html: section.outerHTML, height: outerHeight(section), sectionStart: true });
        return;
      }
      var isFirstUnit = true;
      entries.forEach(function (e) {
        if (e.kind === "table") pushTableRun(e.table, e.wrapperClassName, isFirstUnit);
        else units.push({ type: "atomic", html: e.node.outerHTML, height: outerHeight(e.node), sectionStart: isFirstUnit });
        isFirstUnit = false;
      });
    });

    document.body.removeChild(measureClone);

    // ---- page-fill walk ----
    // A tiny safety margin keeps content from landing exactly flush with the page
    // boundary: print engines can round sub-pixel layout units unfavorably at an exact
    // edge and push a near-empty remainder onto a phantom extra page.
    var PAGE_SAFETY_MARGIN_PX = 10;
    var pageContentBudget = Math.max(0, dims.contentHeightPx - PAGE_SAFETY_MARGIN_PX);
    var pageEls = [];
    var currentPage = null;
    var pageIsEmpty = true;
    var remaining = 0;
    var currentTbody = null;
    var currentRunId = null;

    function newPage() {
      currentPage = document.createElement("div");
      currentPage.className = "print-page__content";
      pageEls.push(currentPage);
      pageIsEmpty = true;
      remaining = pageContentBudget;
      currentTbody = null;
      currentRunId = null;
    }
    newPage();

    function appendAtomicHtml(html) {
      var tmp = document.createElement("div");
      tmp.innerHTML = html;
      if (tmp.firstElementChild) currentPage.appendChild(tmp.firstElementChild);
      pageIsEmpty = false;
    }

    function openRunOnCurrentPage(run, headerCost) {
      var wrapperEl = currentPage;
      if (run.wrapperClassName) {
        wrapperEl = document.createElement("div");
        wrapperEl.className = run.wrapperClassName;
        currentPage.appendChild(wrapperEl);
      }
      var table = document.createElement("table");
      table.className = run.tableClassName;
      if (run.tableStyle) table.setAttribute("style", run.tableStyle);
      table.style.tableLayout = "fixed";
      if (run.totalWidth) table.style.width = run.totalWidth + "px";
      var showHead = headerCost > 0;
      table.innerHTML = run.colgroupHtml + (showHead ? run.theadHtml : "") + "<tbody></tbody>";
      wrapperEl.appendChild(table);
      currentTbody = table.querySelector("tbody");
      currentRunId = run.runId;
      pageIsEmpty = false;
      remaining -= headerCost;
      run.firstPageDone = true;
    }

    units.forEach(function (u) {
      if (u.forceNewPage && !pageIsEmpty) newPage();
      else if (settings.pageBreakPerSection && u.sectionStart && !pageIsEmpty) newPage();

      if (u.type === "atomic") {
        if (u.height > remaining && !pageIsEmpty) newPage();
        appendAtomicHtml(u.html);
        remaining -= u.height;
        currentTbody = null;
        currentRunId = null;
        return;
      }

      var needsNewRun = currentRunId !== u.run.runId;
      var headerCost = needsNewRun && (!u.run.firstPageDone || settings.repeatHeader) ? u.run.theadHeight : 0;
      if (headerCost + u.height > remaining && !pageIsEmpty) {
        newPage();
        needsNewRun = true;
        headerCost = !u.run.firstPageDone || settings.repeatHeader ? u.run.theadHeight : 0;
      }
      if (needsNewRun) openRunOnCurrentPage(u.run, headerCost);
      if (u.html) currentTbody.insertAdjacentHTML("beforeend", u.html);
      remaining -= u.height;
      pageIsEmpty = false;
    });

    var numPages = pageEls.length;

    hint.textContent = numPages + " page" + (numPages > 1 ? "s" : "") + " at this page size — approximate; printed table headers repeat on every page automatically.";

    for (var i = 0; i < numPages; i++) {
      var pageOuter = document.createElement("div");
      pageOuter.className = "print-page-outer";
      pageOuter.style.width = (dims.pageWidthPx * zoomFactor) + "px";
      pageOuter.style.height = (dims.pageHeightPx * zoomFactor) + "px";
      pageOuter.style.setProperty("--natural-width", dims.contentWidthPx + "px");
      pageOuter.style.setProperty("--natural-height", dims.contentHeightPx + "px");

      var pageDiv = document.createElement("div");
      pageDiv.className = "print-page";
      pageDiv.style.width = dims.pageWidthPx + "px";
      pageDiv.style.height = dims.pageHeightPx + "px";
      pageDiv.style.transform = "scale(" + zoomFactor + ")";
      pageDiv.style.transformOrigin = "top left";

      var viewport = document.createElement("div");
      viewport.className = "print-page__viewport";
      viewport.style.width = dims.contentWidthPx + "px";
      viewport.style.height = dims.contentHeightPx + "px";
      viewport.style.marginTop = dims.marginTopPx + "px";
      viewport.style.marginRight = dims.marginRightPx + "px";
      viewport.style.marginBottom = dims.marginBottomPx + "px";
      viewport.style.marginLeft = dims.marginLeftPx + "px";

      viewport.appendChild(pageEls[i]);
      pageDiv.appendChild(viewport);

      var label = document.createElement("div");
      label.className = "print-page__label";
      label.textContent = "Page " + (i + 1) + " of " + numPages;
      pageDiv.appendChild(label);

      pageOuter.appendChild(pageDiv);
      pagesWrap.appendChild(pageOuter);
    }

    toolbar.querySelector("#ppZoomOut").addEventListener("click", function () {
      printZoomAuto = false;
      printZoom = Math.max(25, printZoom - 10);
      render();
    });
    toolbar.querySelector("#ppZoomIn").addEventListener("click", function () {
      printZoomAuto = false;
      printZoom = Math.min(200, printZoom + 10);
      render();
    });
    toolbar.querySelector("#ppZoomFit").addEventListener("click", function () {
      printZoomAuto = true;
      render();
    });

    return container;
  }

  function getLineItemSchedule(item) {
    if (item.scheduleMode === "CUSTOM") {
      return item.payments.slice().sort(function (a, b) { return a.date.localeCompare(b.date); })
        .map(function (p) { return { date: p.date.slice(0, 10), amount: p.amount }; });
    }
    if (!item.startDate || !item.endDate) return [];
    return computeEvenSchedule(item.startDate.slice(0, 10), item.endDate.slice(0, 10), item.totalBudget);
  }
  // Actual spend is always a dated ledger — unlike the budget, there's no "even spread"
  // mode for money that's already gone out the door.
  function getLineItemActuals(item) {
    return (item.actuals || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); })
      .map(function (a) { return { date: a.date.slice(0, 10), amount: a.amount }; });
  }
  function computeCapTable(members) {
    var totals = members.map(function (m) {
      return { member: m, totalContributed: sum(m.contributions.map(function (c) { return c.amount; })),
        totalDistributed: sum(m.distributions.map(function (d) { return d.amount; })) };
    });
    var manualTotalPercent = sum(members.filter(function (m) { return m.ownershipPercent != null; }).map(function (m) { return m.ownershipPercent; }));
    var remainingPercent = Math.max(0, 100 - manualTotalPercent);
    var proRataBase = sum(totals.filter(function (t) { return t.member.ownershipPercent == null; }).map(function (t) { return t.totalContributed; }));
    return totals.map(function (t) {
      var ownershipPercent;
      if (t.member.ownershipPercent != null) ownershipPercent = t.member.ownershipPercent;
      else if (proRataBase > 0) ownershipPercent = (t.totalContributed / proRataBase) * remainingPercent;
      else ownershipPercent = 0;
      return {
        id: t.member.id, name: t.member.name, role: t.member.role,
        totalContributed: t.totalContributed, totalDistributed: t.totalDistributed,
        netPosition: t.totalContributed - t.totalDistributed,
        ownershipPercent: round(ownershipPercent), ownershipIsManual: t.member.ownershipPercent != null,
      };
    });
  }
  function autoSplitAmount(rows, totalAmount) {
    var totalPercent = sum(rows.map(function (r) { return r.ownershipPercent; }));
    if (totalPercent <= 0) return rows.map(function (r) { return { memberId: r.id, amount: 0 }; });
    var allocated = 0;
    return rows.map(function (r, i) {
      var isLast = i === rows.length - 1;
      var amount = isLast ? round2(totalAmount - allocated) : round2((r.ownershipPercent / totalPercent) * totalAmount);
      allocated += amount;
      return { memberId: r.id, amount: amount };
    });
  }

  function monthRangeInclusive(startIso, endIso) {
    var s = startIso.slice(0, 7).split("-").map(Number), e = endIso.slice(0, 7).split("-").map(Number);
    var startKey = s[0] * 12 + (s[1] - 1), endKey = e[0] * 12 + (e[1] - 1);
    var months = [];
    for (var k = startKey; k <= endKey; k++) {
      var y = Math.floor(k / 12), mo = k % 12;
      months.push(y + "-" + String(mo + 1).padStart(2, "0") + "-01");
    }
    return months;
  }

  // Simple (non-compounding) preferred return: each month's accrual is the annual pref
  // rate applied to the capital balance carried in from the end of the prior month, so a
  // contribution made mid-month doesn't itself earn pref until the following month.
  // Capital returns reduce the balance pref accrues on going forward; they don't touch
  // already-accrued unpaid pref, which is tracked separately and only settled at exit.
  function computeCapTableDetail(proj) {
    var settings = proj.capTableSettings || {};
    if (!settings.startDate || !settings.endDate) return { months: [], members: [], totals: null };
    var months = monthRangeInclusive(settings.startDate, settings.endDate);
    var monthlyRate = (Number(settings.prefPercent) || 0) / 100 / 12;

    var members = (proj.capTable || []).map(function (m) {
      var capitalByMonth = {}, prefByMonth = {}, totalByMonth = {};
      var balance = 0, cumPref = 0;
      months.forEach(function (mo) {
        var moKey = mo.slice(0, 7);
        var accrual = round2(balance * monthlyRate);
        cumPref = round2(cumPref + accrual);
        var contribThisMonth = sum(m.contributions.filter(function (c) { return c.date.slice(0, 7) === moKey; }).map(function (c) { return c.amount; }));
        var returnThisMonth = sum((m.capitalReturns || []).filter(function (r) { return r.date.slice(0, 7) === moKey; }).map(function (r) { return r.amount; }));
        balance = round2(balance + contribThisMonth - returnThisMonth);
        capitalByMonth[mo] = balance;
        prefByMonth[mo] = accrual;
        totalByMonth[mo] = round2(balance + cumPref);
      });
      return {
        id: m.id, name: m.name, role: m.role,
        capitalByMonth: capitalByMonth, prefByMonth: prefByMonth, totalByMonth: totalByMonth,
        finalCapital: balance, finalCumPref: cumPref,
      };
    });

    var totals = { capitalByMonth: {}, prefByMonth: {}, totalByMonth: {} };
    months.forEach(function (mo) {
      totals.capitalByMonth[mo] = round2(sum(members.map(function (m) { return m.capitalByMonth[mo]; })));
      totals.prefByMonth[mo] = round2(sum(members.map(function (m) { return m.prefByMonth[mo]; })));
      totals.totalByMonth[mo] = round2(sum(members.map(function (m) { return m.totalByMonth[mo]; })));
    });

    members.forEach(function (m) {
      m.ownershipByMonth = {};
      months.forEach(function (mo) {
        var totalCap = totals.capitalByMonth[mo];
        m.ownershipByMonth[mo] = totalCap > 0 ? round2((m.capitalByMonth[mo] / totalCap) * 100) : 0;
      });
    });

    return { months: months, members: members, totals: totals };
  }

  // Budget items share the same {scheduleMode, payments, startDate, endDate, totalBudget}
  // shape as line items, so getLineItemSchedule() works on either.
  function mergeSchedules(scheduleArrays) {
    var map = {};
    scheduleArrays.forEach(function (sched) {
      sched.forEach(function (b) { map[b.date] = round2((map[b.date] || 0) + b.amount); });
    });
    return Object.keys(map).sort().map(function (d) { return { date: d, amount: map[d] }; });
  }

  function buildSummary(proj) {
    var budgetItems = proj.budgetItems || [];
    var itemsWithSchedule = proj.lineItems.map(function (li) {
      var linked = budgetItems.filter(function (bi) { return bi.linkedLineItemId === li.id; });
      if (linked.length === 0) {
        return { li: li, schedule: getLineItemSchedule(li), actuals: getLineItemActuals(li),
          effectiveBudget: li.totalBudget, linkedCount: 0, linkedItems: [] };
      }
      return {
        li: li, schedule: mergeSchedules(linked.map(getLineItemSchedule)),
        actuals: mergeSchedules(linked.map(getLineItemActuals)),
        effectiveBudget: sum(linked.map(function (bi) { return bi.totalBudget; })), linkedCount: linked.length,
        linkedItems: linked,
      };
    });
    var minKey = null, maxKey = null;
    function consider(iso) {
      var p = iso.split("-").map(Number), k = p[0] * 12 + (p[1] - 1);
      minKey = minKey === null ? k : Math.min(minKey, k);
      maxKey = maxKey === null ? k : Math.max(maxKey, k);
    }
    itemsWithSchedule.forEach(function (x) {
      x.schedule.forEach(function (b) { consider(b.date.slice(0, 7) + "-01"); });
      x.actuals.forEach(function (a) { consider(a.date.slice(0, 7) + "-01"); });
    });
    proj.draws.forEach(function (d) {
      consider(d.date.slice(0, 10));
      if (d.actualDate) consider(d.actualDate.slice(0, 10));
    });
    var months = [];
    if (minKey !== null) for (var k = minKey; k <= maxKey; k++) { var y = Math.floor(k / 12), m = k % 12; months.push(y + "-" + String(m + 1).padStart(2, "0") + "-01"); }

    function monthlyMapFor(schedule) {
      var map = {};
      schedule.forEach(function (b) { var key = b.date.slice(0, 7) + "-01"; map[key] = (map[key] || 0) + b.amount; });
      return map;
    }
    function totalOf(schedule) { return sum(schedule.map(function (b) { return b.amount; })); }

    var categoryList = proj.categories.map(function (c) { return { id: c.id, name: c.name }; }).concat([{ id: null, name: "Uncategorized" }]);
    var categories = categoryList.map(function (cat) {
      var items = itemsWithSchedule.filter(function (x) { return x.li.categoryId === cat.id; });
      if (items.length === 0) return null;
      var lineItems = items.map(function (x) {
        return { id: x.li.id, code: x.li.code, description: x.li.description, totalBudget: x.effectiveBudget,
          scheduleMode: x.li.scheduleMode, monthly: monthlyMapFor(x.schedule), linkedBudgetCount: x.linkedCount,
          color: x.li.color,
          actualMonthly: monthlyMapFor(x.actuals), actualTotal: totalOf(x.actuals),
          linkedBudgetItems: x.linkedItems.map(function (bi) {
            return { id: bi.id, description: bi.description, totalBudget: bi.totalBudget, monthly: monthlyMapFor(getLineItemSchedule(bi)),
              actualMonthly: monthlyMapFor(getLineItemActuals(bi)), actualTotal: totalOf(getLineItemActuals(bi)) };
          }) };
      });
      var subtotal = {}, subtotalTotal = 0, actualSubtotal = {}, actualSubtotalTotal = 0;
      lineItems.forEach(function (lo) {
        Object.keys(lo.monthly).forEach(function (mo) { subtotal[mo] = (subtotal[mo] || 0) + lo.monthly[mo]; });
        subtotalTotal += lo.totalBudget;
        Object.keys(lo.actualMonthly).forEach(function (mo) { actualSubtotal[mo] = (actualSubtotal[mo] || 0) + lo.actualMonthly[mo]; });
        actualSubtotalTotal += lo.actualTotal;
      });
      return { id: cat.id, name: cat.name, lineItems: lineItems, subtotal: subtotal, subtotalTotal: subtotalTotal,
        actualSubtotal: actualSubtotal, actualSubtotalTotal: actualSubtotalTotal };
    }).filter(function (c) { return c !== null; });

    var grandMonthly = {}, grandTotal = 0, grandActualMonthly = {}, grandActualTotal = 0;
    categories.forEach(function (cat) {
      Object.keys(cat.subtotal).forEach(function (mo) { grandMonthly[mo] = (grandMonthly[mo] || 0) + cat.subtotal[mo]; });
      grandTotal += cat.subtotalTotal;
      Object.keys(cat.actualSubtotal).forEach(function (mo) { grandActualMonthly[mo] = (grandActualMonthly[mo] || 0) + cat.actualSubtotal[mo]; });
      grandActualTotal += cat.actualSubtotalTotal;
    });

    var capTableRows = computeCapTable(proj.capTable);
    return {
      months: months, categories: categories,
      grandTotal: { monthly: grandMonthly, total: grandTotal, actualMonthly: grandActualMonthly, actualTotal: grandActualTotal },
      draws: proj.draws, capTable: capTableRows,
      equityTotals: {
        totalContributed: sum(capTableRows.map(function (r) { return r.totalContributed; })),
        totalDistributed: sum(capTableRows.map(function (r) { return r.totalDistributed; })),
      },
    };
  }

  // ---------- CSV export ----------
  var EXPORT_SECTION_LABELS = {
    project: "Project info",
    lineItems: "Line items",
    draws: "Draws",
    capTable: "Cap table",
    summary: "Cash flow summary (monthly grid)",
  };
  var EXPORT_SECTION_ORDER = ["project", "lineItems", "draws", "capTable", "summary"];

  function csvEscape(value) {
    var s = value == null ? "" : String(value);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function toCsvRow(cells) { return cells.map(csvEscape).join(","); }
  function money(n) { return Math.round(((n || 0) + Number.EPSILON) * 100) / 100; }

  function buildProjectCsv(proj) {
    return [
      toCsvRow(["Field", "Value"]),
      toCsvRow(["Name", proj.name]),
      toCsvRow(["Client", proj.client]),
      toCsvRow(["Address", proj.address]),
      toCsvRow(["Description", proj.description]),
      toCsvRow(["Date", proj.projectDate]),
    ].join("\n");
  }
  function buildLineItemsCsv(proj) {
    function catName(id) { var c = proj.categories.filter(function (x) { return x.id === id; })[0]; return c ? c.name : ""; }
    var rows = [toCsvRow(["Category", "Code", "Description", "Budget", "Schedule Mode", "Start Date", "End Date", "Payment Date", "Payment Amount"])];
    proj.lineItems.forEach(function (li) {
      if (li.scheduleMode === "CUSTOM" && li.payments.length) {
        li.payments.forEach(function (p) {
          rows.push(toCsvRow([catName(li.categoryId), li.code, li.description, money(li.totalBudget), li.scheduleMode, "", "", p.date, money(p.amount)]));
        });
      } else {
        rows.push(toCsvRow([catName(li.categoryId), li.code, li.description, money(li.totalBudget), li.scheduleMode, li.startDate, li.endDate, "", ""]));
      }
    });
    return rows.join("\n");
  }
  function buildDrawsCsv(proj) {
    var rows = [toCsvRow(["Name", "Date", "Amount", "Source"])];
    proj.draws.forEach(function (d) { rows.push(toCsvRow([d.name, d.date, money(d.amount), d.source])); });
    return rows.join("\n");
  }
  function buildCapTableCsv(proj) {
    var rows = [toCsvRow(["Member", "Role", "Ownership %", "Type", "Date", "Amount", "Note"])];
    proj.capTable.forEach(function (m) {
      if (!m.contributions.length && !m.distributions.length) {
        rows.push(toCsvRow([m.name, m.role, m.ownershipPercent, "", "", "", ""]));
      }
      m.contributions.forEach(function (c) { rows.push(toCsvRow([m.name, m.role, m.ownershipPercent, "Contribution", c.date, money(c.amount), c.note])); });
      m.distributions.forEach(function (d) { rows.push(toCsvRow([m.name, m.role, m.ownershipPercent, "Distribution", d.date, money(d.amount), d.note])); });
    });
    return rows.join("\n");
  }
  function buildSummaryCsv(summary) {
    var rows = [toCsvRow(["Line item", "Budget"].concat(summary.months))];
    summary.categories.forEach(function (cat) {
      rows.push(toCsvRow([cat.name, ""].concat(summary.months.map(function () { return ""; }))));
      cat.lineItems.forEach(function (li) {
        rows.push(toCsvRow([(li.code ? li.code + " " + li.description : li.description), money(li.totalBudget)]
          .concat(summary.months.map(function (m) { return money(li.monthly[m]); }))));
      });
      rows.push(toCsvRow(["Total " + cat.name, money(cat.subtotalTotal)].concat(summary.months.map(function (m) { return money(cat.subtotal[m]); }))));
    });
    rows.push(toCsvRow(["Grand Total", money(summary.grandTotal.total)].concat(summary.months.map(function (m) { return money(summary.grandTotal.monthly[m]); }))));
    return rows.join("\n");
  }
  function buildCombinedCsv(proj, summary, sections) {
    var parts = [];
    sections.forEach(function (s) {
      parts.push("# " + EXPORT_SECTION_LABELS[s]);
      if (s === "project") parts.push(buildProjectCsv(proj));
      if (s === "lineItems") parts.push(buildLineItemsCsv(proj));
      if (s === "draws") parts.push(buildDrawsCsv(proj));
      if (s === "capTable") parts.push(buildCapTableCsv(proj));
      if (s === "summary" && summary) parts.push(buildSummaryCsv(summary));
      parts.push("");
    });
    return parts.join("\n");
  }
  function downloadCsv(filename, content) {
    var blob = new Blob([content], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function bindInputs(container) {

        if (path === "project.address") project.address = input.value;
        if (path === "project.projectDate") project.projectDate = input.value;

  // ---------- Cashflow (chart + monthly grid) ----------
  function getCellColor(lineItemId, month) {
    var entry = project.cashflowCellColors.filter(function (c) { return c.lineItemId === lineItemId && c.month === month; })[0];
    return entry ? entry.color : null;
  }
  function setCellColor(lineItemId, month, color) {
    project.cashflowCellColors = project.cashflowCellColors.filter(function (c) { return !(c.lineItemId === lineItemId && c.month === month); });
    if (color) project.cashflowCellColors.push({ lineItemId: lineItemId, month: month, color: color });
  }
  function coloredTdAttrs(baseClass, color) {
    if (!color) return 'class="' + baseClass + '"';
    return 'class="' + baseClass + ' summary-grid__colored" style="--cell-bg:' + esc(color) + ';"';
  }

  function closeCfColorMenu() {

  function closeCfColorMenuOnOutsideClick(e) {

  function applyCfColorChoice(color) {

  // ---------- Cashflow cell selection (Excel-like sum/average/count status bar) ----------
  // Ranges are expressed in the <table>'s native rowIndex/cellIndex space, so a
  // rectangular drag/shift-click selection is just a min/max box over those — no need
  // to track our own grid coordinates alongside the generated HTML.
  var cfSelection = []; // {r1,c1,r2,c2}[]
  var cfSelectionAnchor = null; // {r,c} — anchor cell for shift-click / the in-progress drag range
  var cfSelecting = false;
  function cfCellCoord(td) { return { r: td.parentElement.rowIndex, c: td.cellIndex }; }
  function cfNormalizeRange(a, b) { return { r1: Math.min(a.r, b.r), r2: Math.max(a.r, b.r), c1: Math.min(a.c, b.c), c2: Math.max(a.c, b.c) }; }
  function cfClearSelectionHighlight(table) {
    table.querySelectorAll(".summary-grid__cell--selected").forEach(function (td) { td.classList.remove("summary-grid__cell--selected"); });
  }
  function cfApplySelectionHighlight(table) {
    cfClearSelectionHighlight(table);
    var rows = table.rows;
    cfSelection.forEach(function (range) {
      for (var r = range.r1; r <= range.r2; r++) {
        var row = rows[r];
        if (!row) continue;
        for (var c = range.c1; c <= range.c2; c++) {
          var cell = row.cells[c];
          if (cell && cell.classList.contains("col-money")) cell.classList.add("summary-grid__cell--selected");
        }
      }
    });
  }
  // Sums off the rendered $-formatted text itself (not a separate raw-value data
  // attribute) so it always matches what's on screen, including empty/"—" cells.
  function cfParseMoneyText(text) {
    var t = (text || "").trim();
    if (!t || t === "—") return null;
    var n = parseFloat(t.replace(/[^0-9.]/g, ""));
    if (isNaN(n)) return null;
    return t.indexOf("-") !== -1 ? -n : n;
  }
  function cfUpdateSelectionBar(table) {
    var bar = document.getElementById("cfSelectionBar");
    var values = [];
    var seen = {};
    cfSelection.forEach(function (range) {
      var rows = table.rows;
      for (var r = range.r1; r <= range.r2; r++) {
        var row = rows[r];
        if (!row) continue;
        for (var c = range.c1; c <= range.c2; c++) {
          var key = r + "-" + c;
          if (seen[key]) continue;
          seen[key] = true;
          var cell = row.cells[c];
          if (!cell || !cell.classList.contains("col-money")) continue;
          var v = cfParseMoneyText(cell.textContent);
          if (v != null) values.push(v);
        }
      }
    });
    if (!values.length) { bar.style.display = "none"; return; }
    var sum = values.reduce(function (a, b) { return a + b; }, 0);
    bar.style.display = "flex";
    bar.innerHTML = "<span>Count<strong>" + values.length + "</strong></span>" +
      "<span>Average<strong>" + fmtMoney(sum / values.length, true) + "</strong></span>" +
      "<span>Sum<strong>" + fmtMoney(sum, true) + "</strong></span>";
  }
  function cfClearSelection(table) {
    cfSelection = [];
    cfSelectionAnchor = null;
    if (table) cfClearSelectionHighlight(table);
    var bar = document.getElementById("cfSelectionBar");
    if (bar) bar.style.display = "none";
  }
  function wireCashflowSelection(table) {
    cfClearSelection(table);
    table.addEventListener("mousedown", function (e) {
      var td = e.target.closest("td.col-money");
      if (!td) return;
      e.preventDefault();
      var coord = cfCellCoord(td);
      if (e.shiftKey && cfSelectionAnchor) {
        var extended = cfNormalizeRange(cfSelectionAnchor, coord);
        if (cfSelection.length) cfSelection[cfSelection.length - 1] = extended;
        else cfSelection.push(extended);
      } else if (e.ctrlKey || e.metaKey) {
        cfSelectionAnchor = coord;
        cfSelection.push(cfNormalizeRange(coord, coord));
      } else {
        cfSelectionAnchor = coord;
        cfSelection = [cfNormalizeRange(coord, coord)];
      }
      cfSelecting = true;
      cfApplySelectionHighlight(table);
      cfUpdateSelectionBar(table);
    });
    table.addEventListener("mousemove", function (e) {
      if (!cfSelecting || !cfSelectionAnchor || !cfSelection.length) return;
      var td = e.target.closest("td.col-money");
      if (!td) return;
      cfSelection[cfSelection.length - 1] = cfNormalizeRange(cfSelectionAnchor, cfCellCoord(td));
      cfApplySelectionHighlight(table);
      cfUpdateSelectionBar(table);
    });
  }

  // Starting/ending month and month-count span for a row's monthly schedule, derived
  // from the first/last month with a nonzero amount — no separate stored field, since
  // the monthly map is already the source of truth for where a schedule lands.
  function scheduleRangeOf(monthly) {
    if (!monthly) return null;
    var keys = Object.keys(monthly).filter(function (m) { return monthly[m]; }).sort();
    if (!keys.length) return null;
    var start = keys[0], end = keys[keys.length - 1];
    var sy = Number(start.slice(0, 4)), sm = Number(start.slice(5, 7));
    var ey = Number(end.slice(0, 4)), em = Number(end.slice(5, 7));
    return { start: start, end: end, duration: (ey - sy) * 12 + (em - sm) + 1 };
  }
  // monthly === null renders three blank cells (for rows with no single schedule of
  // their own, e.g. the category header/Notes rows) rather than a "—" placeholder,
  // matching how those rows already render blank (not dashed) month cells.
  function rangeCellsHtml(monthly) {
    if (!cashflowShowScheduleRange) return "";
    if (!monthly) return '<td class="summary-grid__rangecol"></td><td class="summary-grid__rangecol"></td><td class="summary-grid__rangecol"></td>';
    var r = scheduleRangeOf(monthly);
    return '<td class="summary-grid__rangecol">' + (r ? fmtMonth(r.start) : "—") + "</td>" +
      '<td class="summary-grid__rangecol">' + (r ? r.duration : "—") + "</td>" +
      '<td class="summary-grid__rangecol">' + (r ? fmtMonth(r.end) : "—") + "</td>";
  }

  // A muted, indented sub-row under a budget row showing the same months' actual
  // spend, so the two are compared by simply reading down one column at a time.
  function actualRowHtml(label, actualMonthly, actualTotal, budgetTotal, months, colClassFn) {
    var delta = actualTotal - (budgetTotal || 0);
    var deltaTitle = budgetTotal
      ? " (" + (delta > 0 ? "+" : "") + fmtMoney(delta, true) + " vs budget)"
      : "";
    var html = '<tr class="summary-grid__actual"><td class="summary-grid__label summary-grid__actual-label">' + label + "</td>";
    html += '<td class="col-money summary-grid__budget" title="Actual total' + esc(deltaTitle) + '">' + (actualTotal ? fmtMoney(actualTotal) : "") + "</td>";
    html += rangeCellsHtml(actualMonthly);
    months.forEach(function (m) {
      html += '<td class="col-money' + colClassFn(m) + '">' + (actualMonthly[m] ? fmtMoney(actualMonthly[m]) : "") + "</td>";
    });
    html += "</tr>";
    return html;
  }

  function buildCashflowSection(summary, forcePrint, sectionsFilter) {
    // The timeline lives on its own tab now; it only comes through here for print.

    function yearShadeClass(m) { return uniqueYears.indexOf(yearOf(m)) % 2 === 1 ? " summary-grid__year-b" : ""; }

          '<span class="summary-grid-controls__gap" style="color:var(--text-muted);">right-click a row or cell to color it</span>';

      var html = '<table class="summary-grid"><thead><tr><th class="summary-grid__label">Line item</th><th class="col-money summary-grid__budget">' + (mode === "actual" ? "Actual" : "Budget") + "</th>";
      if (cashflowShowScheduleRange) html += '<th class="summary-grid__rangecol">Start</th><th class="summary-grid__rangecol">Duration</th><th class="summary-grid__rangecol">End</th>';
      summary.months.forEach(function (m, i) { html += '<th class="col-money' + colClass(m) + '"><span class="summary-grid__monthnum">Month ' + (i + 1) + '</span><span class="summary-grid__monthlabel">' + fmtMonth(m) + "</span></th>"; });
      html += "</tr></thead><tbody>";

      summary.months.forEach(function (m) {

      });

          html += "</tr>";
        }
        if (mode === "both") {
          html += actualRowHtml("Actual — Total " + esc(cat.name), cat.actualSubtotal, cat.actualSubtotalTotal, cat.subtotalTotal, summary.months, colClass);
        } else if (mode === "actual") {
          html += '<tr class="summary-grid__subtotal"><td class="summary-grid__label">Total ' + esc(cat.name) + "</td><td class=\"col-money summary-grid__budget\">" + (cat.actualSubtotalTotal ? fmtMoney(cat.actualSubtotalTotal) : "") + "</td>";
          html += rangeCellsHtml(cat.actualSubtotal);
          summary.months.forEach(function (m) { html += '<td class="col-money' + colClass(m) + '">' + (cat.actualSubtotal[m] ? fmtMoney(cat.actualSubtotal[m]) : "") + "</td>"; });
          html += "</tr>";
        }
      });
      if (mode !== "actual") {
        html += '<tr class="summary-grid__grandtotal"><td class="summary-grid__label">Grand Total</td><td class="col-money summary-grid__budget">' + fmtMoney(summary.grandTotal.total) + "</td>";
        html += rangeCellsHtml(summary.grandTotal.monthly);
        summary.months.forEach(function (m) { html += '<td class="col-money' + colClass(m) + '">' + (summary.grandTotal.monthly[m] ? fmtMoney(summary.grandTotal.monthly[m]) : "") + "</td>"; });
        html += "</tr>";
      }
      if (mode === "both") {
        html += actualRowHtml("Actual Grand Total", summary.grandTotal.actualMonthly, summary.grandTotal.actualTotal, summary.grandTotal.total, summary.months, colClass);
      } else if (mode === "actual") {
        html += '<tr class="summary-grid__grandtotal"><td class="summary-grid__label">Grand Total</td><td class="col-money summary-grid__budget">' + (summary.grandTotal.actualTotal ? fmtMoney(summary.grandTotal.actualTotal) : "") + "</td>";
        html += rangeCellsHtml(summary.grandTotal.actualMonthly);
        summary.months.forEach(function (m) { html += '<td class="col-money' + colClass(m) + '">' + (summary.grandTotal.actualMonthly[m] ? fmtMoney(summary.grandTotal.actualMonthly[m]) : "") + "</td>"; });
        html += "</tr>";
      }
      html += "</tbody></table>";
      gridWrap.innerHTML = html;

      // offsetWidth is always 0 for a subtree not yet attached to the document, so measure
      // via a temporary off-screen attach (gridWrap isn't in the live DOM until the caller
      // appends the wrap this function returns).
      gridWrap.style.position = "absolute";
      gridWrap.style.visibility = "hidden";
      gridWrap.style.left = "-99999px";
      document.body.appendChild(gridWrap);
      var labelCell = gridWrap.querySelector(".summary-grid__label");
      if (labelCell) gridWrap.style.setProperty("--budget-col-left", labelCell.offsetWidth + "px");
      document.body.removeChild(gridWrap);
      gridWrap.style.position = "";
      gridWrap.style.visibility = "";
      gridWrap.style.left = "";
      gridWrap.style.setProperty("--section-gap", cashflowSectionGapPx + "px");

      tableSection.appendChild(gridWrap);
      wrap.appendChild(tableSection);
    }

    if (include.cashflowTimeline) {
      wrap.appendChild(buildCashflowTimelineSection(summary, forcePrint));
    }

    if (!forcePrint) {
      var cfTable = wrap.querySelector("table.summary-grid");
      if (cfTable) wireCashflowSelection(cfTable);
      var chartBtn = wrap.querySelector("#chartCollapseBtn");
      if (chartBtn) chartBtn.addEventListener("click", function () { chartCollapsed = !chartCollapsed; render(); });
      var highlightBtn = wrap.querySelector("#highlightMonthBtn");
      if (highlightBtn) highlightBtn.addEventListener("click", function () { highlightCurrentMonth = !highlightCurrentMonth; render(); });
      var fullWidthBtn = wrap.querySelector("#cfFullWidthBtn");
      if (fullWidthBtn) fullWidthBtn.addEventListener("click", function () { cashflowFullWidth = !cashflowFullWidth; render(); });
      var showRangeBtn = wrap.querySelector("#cfShowRangeBtn");
      if (showRangeBtn) showRangeBtn.addEventListener("click", function () { cashflowShowScheduleRange = !cashflowShowScheduleRange; render(); });
      var amountModeSel = wrap.querySelector("#cfAmountMode");
      if (amountModeSel) amountModeSel.addEventListener("change", function () { cashflowAmountMode = amountModeSel.value; render(); });
      var gapInput = wrap.querySelector("#cfSectionGap");
      if (gapInput) gapInput.addEventListener("change", function () {
        cashflowSectionGapPx = Math.max(0, Math.min(40, Number(gapInput.value) || 0));
        render();
      });
      // Live-updates a CSS custom property directly (no render()) so dragging the
      // slider stays smooth even on a large grid — matches the Timeline tab's size sliders.
      var zoomInput = wrap.querySelector("#cfZoom");
      if (zoomInput) zoomInput.addEventListener("input", function () {
        cashflowZoomPercent = Number(zoomInput.value);
        var zoomVal = wrap.querySelector("#cfZoomVal");
        if (zoomVal) zoomVal.textContent = cashflowZoomPercent + "%";
        var gw = wrap.querySelector(".summary-grid-wrap");
        if (gw) gw.style.setProperty("--cf-zoom", String(cashflowZoomPercent / 100));
      });
      wrap.querySelectorAll("[data-color-row]").forEach(function (td) {
        td.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          var li = findLineItem(td.getAttribute("data-color-row"));
          openCfColorMenu(e.clientX, e.clientY, "row", td.getAttribute("data-color-row"), null, li ? li.color : null);
        });
      });
      wrap.querySelectorAll("[data-color-cell]").forEach(function (td) {
        td.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          var parts = td.getAttribute("data-color-cell").split("|");
          openCfColorMenu(e.clientX, e.clientY, "cell", parts[0], parts[1], getCellColor(parts[0], parts[1]));
        });
      });
      wrap.querySelectorAll("[data-note-month]").forEach(function (input) {
        input.addEventListener("change", function () {
          monthNotes[input.getAttribute("data-note-month")] = input.value;
          persist();
        });
      });
      wrap.querySelectorAll("[data-toggle-cf-expand]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-toggle-cf-expand");
          if (expandedCashflowLineItemIds[id]) delete expandedCashflowLineItemIds[id];
          else expandedCashflowLineItemIds[id] = true;
          render();
        });
      });
    }

    return wrap;
  }

  // ---------- Cashflow timeline (heatmap) ----------
  // "accent" has no stops: it ramps opacity over the theme's accent color so it
  // follows the user's chosen accent. The rest are fixed multi-hue ramps.
  var TIMELINE_SCHEMES = {
    accent: { label: "Accent (single hue)", stops: null },
    gyr: { label: "Green → Yellow → Red", stops: [[46, 158, 91], [214, 196, 46], [214, 69, 58]] },
    byr: { label: "Blue → Yellow → Red", stops: [[42, 120, 214], [214, 196, 46], [214, 69, 58]] },
    cool: { label: "Blue → Cyan → Green", stops: [[37, 99, 235], [6, 182, 212], [34, 197, 94]] },
    magma: { label: "Purple → Orange → Yellow", stops: [[87, 37, 133], [222, 91, 60], [252, 203, 70]] },
  };

  // `sensitivity` bends the ramp with a power curve: 1 is linear, higher values pull
  // low fractions upward so the many small months spread across the ramp instead of
  // bunching at the pale end while one peak takes everything above it.
  function heatFill(t, scheme, sensitivity) {
    if (!(t > 0)) return "transparent";
    t = Math.pow(Math.min(1, t), 1 / (sensitivity || 1));
    var s = TIMELINE_SCHEMES[scheme] || TIMELINE_SCHEMES.accent;
    // Single-hue: keep a visible floor so small non-zero months don't vanish.
    if (!s.stops) return "color-mix(in srgb, var(--accent) " + Math.round(12 + 88 * t) + "%, transparent)";
    var pos = t * (s.stops.length - 1);
    var i = Math.min(s.stops.length - 2, Math.floor(pos));
    var f = pos - i;
    var c = [0, 1, 2].map(function (k) {
      return Math.round(s.stops[i][k] + (s.stops[i + 1][k] - s.stops[i][k]) * f);
    });
    return "rgb(" + c.join(",") + ")";
  }

  // Sizing has to live on the <table> itself, not only on the scroll wrapper:
  // print pagination flattens a section into individual rows and rebuilds the
  // table, so anything set on an ancestor is lost. (Hit this as columns
  // stretching to fill the page whenever a page was wide enough that the
  // fit-scaling step decided no scaling — and therefore no wrapper — was needed.)
  function timelineSizingCss() {
    return "--pill-w:" + timelineSettings.cellLength + "px;" +
      "--pill-h:" + timelineSettings.cellThickness + "px;" +
      "--pill-gap:" + timelineSettings.cellGap + "px;" +
      "--section-gap:" + timelineSettings.sectionGap + "px;";
  }
  function applyTimelineSizing(el) {
    [el].concat(Array.prototype.slice.call(el.querySelectorAll(".cf-heatmap"))).forEach(function (node) {
      node.style.setProperty("--pill-w", timelineSettings.cellLength + "px");
      node.style.setProperty("--pill-h", timelineSettings.cellThickness + "px");
      node.style.setProperty("--pill-gap", timelineSettings.cellGap + "px");
      node.style.setProperty("--section-gap", timelineSettings.sectionGap + "px");
    });
  }

  function timelineRowsFor(summary) {
    var rows = [];
    summary.categories.forEach(function (cat) {
      rows.push({ kind: "category", label: cat.name });
      cat.lineItems.forEach(function (li) {
        rows.push({ kind: "item", label: li.description, code: li.code, color: li.color,
          total: li.totalBudget, monthly: li.monthly,
          actualTotal: li.actualTotal, actualMonthly: li.actualMonthly });
      });
      rows.push({ kind: "subtotal", label: "Total " + cat.name, total: cat.subtotalTotal, monthly: cat.subtotal,
        actualTotal: cat.actualSubtotalTotal, actualMonthly: cat.actualSubtotal });
    });
    if (rows.length) {
      rows.push({ kind: "grandtotal", label: "Grand Total", total: summary.grandTotal.total, monthly: summary.grandTotal.monthly,
        actualTotal: summary.grandTotal.actualTotal, actualMonthly: summary.grandTotal.actualMonthly });
    }
    return rows;
  }

  // Returns max(|amount|) for a row. With basis "project" every row of the same
  // kind shares one max, so line items become comparable against each other;
  // subtotal and grand-total rows keep their own scales, since folding them into
  // the same max would flatten every individual line to near-nothing.
  // mode "both" pools a row's budget and actual pills into one shared max (rather than
  // each scaling independently), so the two rows stay comparable at a glance instead of
  // both maxing out their own color range regardless of size. Mode "actual" scales off
  // the actual series alone, since that's the only series being drawn.
  function timelineScaleFor(rows, months, basis, mode) {
    function rowMax(row) {
      var mx = 0;
      months.forEach(function (m) {
        if (mode !== "actual") mx = Math.max(mx, Math.abs(row.monthly[m] || 0));
        if (mode !== "budget" && row.actualMonthly) mx = Math.max(mx, Math.abs(row.actualMonthly[m] || 0));
      });
      return mx;
    }
    if (basis !== "project") return rowMax;
    var maxByKind = { item: 0, subtotal: 0, grandtotal: 0 };
    rows.forEach(function (row) {
      if (row.kind === "category") return;
      var mx = rowMax(row);
      if (mx > maxByKind[row.kind]) maxByKind[row.kind] = mx;
    });
    return function (row) { return maxByKind[row.kind] || 0; };
  }

  function buildCashflowTimelineSection(summary, forcePrint) {
    var t = timelineSettings;
    var section = document.createElement("div");
    section.className = "cf-timeline print-section-boundary print-fit-section";
    section.setAttribute("data-fit-key", "cashflowTimeline");

    var legendHtml = '<span class="cf-timeline__legend">low' +
      '<span class="cf-timeline__legend-scale">' +
      [0.02, 0.25, 0.5, 0.75, 1].map(function (f) {
        return '<span class="cf-timeline__legend-step" style="background:' + heatFill(f, t.colorScheme, t.sensitivity) + ';"></span>';
      }).join("") +
      "</span>high</span>";

    section.innerHTML =
      '<div class="cf-timeline__header">' +
        "<h3>Cashflow Timeline</h3>" +
        legendHtml +
      "</div>";

    var rows = timelineRowsFor(summary);
    if (!rows.length) return section;

    var thisMonth = currentMonthKey();
    var uniqueYears = [];
    summary.months.forEach(function (m) { if (uniqueYears.indexOf(yearOf(m)) === -1) uniqueYears.push(yearOf(m)); });

    if (!forcePrint) {
      var controls = document.createElement("div");
      controls.className = "cf-timeline-controls";
      controls.innerHTML =
        '<label>Color scale' +
          '<select id="tlScaleBasis">' +
            '<option value="line"' + (t.scaleBasis === "line" ? " selected" : "") + ">Relative to each line</option>" +
            '<option value="project"' + (t.scaleBasis === "project" ? " selected" : "") + ">Relative to entire project</option>" +
          "</select></label>" +
        '<label>Scheme<select id="tlColorScheme">' +
          Object.keys(TIMELINE_SCHEMES).map(function (k) {
            return '<option value="' + k + '"' + (t.colorScheme === k ? " selected" : "") + ">" + esc(TIMELINE_SCHEMES[k].label) + "</option>";
          }).join("") +
        "</select></label>" +
        '<label class="cf-timeline-controls__range">Length' +
          '<input type="range" id="tlLength" min="6" max="60" step="1" value="' + t.cellLength + '" />' +
          '<span id="tlLengthVal">' + t.cellLength + "px</span></label>" +
        '<label class="cf-timeline-controls__range">Thickness' +
          '<input type="range" id="tlThickness" min="4" max="40" step="1" value="' + t.cellThickness + '" />' +
          '<span id="tlThicknessVal">' + t.cellThickness + "px</span></label>" +
        '<label class="cf-timeline-controls__range">Separation' +
          '<input type="range" id="tlGap" min="0" max="20" step="1" value="' + t.cellGap + '" />' +
          '<span id="tlGapVal">' + t.cellGap + "px</span></label>" +
        '<label class="cf-timeline-controls__range">Section gap' +
          '<input type="range" id="tlSectionGap" min="0" max="40" step="1" value="' + t.sectionGap + '" />' +
          '<span id="tlSectionGapVal">' + t.sectionGap + "px</span></label>" +
        '<label class="cf-timeline-controls__range">Sensitivity' +
          '<input type="range" id="tlSensitivity" min="1" max="5" step="0.1" value="' + t.sensitivity + '" />' +
          '<span id="tlSensitivityVal">' + t.sensitivity + "×</span></label>" +
        '<label style="color:var(--actual);">Amounts' +
          '<select id="tlAmountMode">' +
            '<option value="budget"' + (t.amountMode === "budget" ? " selected" : "") + ">Budget</option>" +
            '<option value="actual"' + (t.amountMode === "actual" ? " selected" : "") + ">Actual only</option>" +
            '<option value="both"' + (t.amountMode === "both" ? " selected" : "") + ">Both</option>" +
          "</select></label>";
      section.appendChild(controls);
    }

    var hint = document.createElement("p");
    hint.className = "cf-timeline__hint";
    hint.textContent = (t.amountMode === "actual" ? "Showing actual spend only. " : "") +
      (t.scaleBasis === "project"
      ? "Shaded across the whole project, so lines are comparable to each other"
      : "Each row is shaded relative to its own peak month") +
      (forcePrint ? "." : " — hover a cell for the amount.");
    section.appendChild(hint);

    var maxFor = timelineScaleFor(rows, summary.months, t.scaleBasis, t.amountMode);

    var html = '<table class="cf-heatmap" style="' + timelineSizingCss() + '"><thead><tr>' +
      '<th class="cf-heatmap__label" rowspan="2">Line item</th>' +
      '<th class="cf-heatmap__row-total" rowspan="2">Total</th>';
    uniqueYears.forEach(function (y, yi) {
      var count = summary.months.filter(function (m) { return yearOf(m) === y; }).length;
      html += '<th class="cf-heatmap__yearhead' + (yi % 2 === 1 ? " cf-heatmap__yearhead--b" : "") + '" colspan="' + count + '">' + esc(y) + "</th>";
    });
    html += '</tr><tr>';
    summary.months.forEach(function (m) {
      html += '<th class="cf-heatmap__monthhead' +
        (highlightCurrentMonth && m === thisMonth ? " cf-heatmap__current" : "") + '">' +
        esc(fmtMonth(m).slice(0, 1)) + "</th>";
    });
    html += "</tr></thead><tbody>";

    rows.forEach(function (row, ri) {
      if (row.kind === "category") {
        html += '<tr class="cf-heatmap__category"><td class="cf-heatmap__label">' + esc(row.label) + "</td>" +
          '<td class="cf-heatmap__row-total"></td>' +
          '<td colspan="' + summary.months.length + '"></td></tr>';
        return;
      }
      var rowMax = maxFor(row);
      var baseRowClass = row.kind === "subtotal" ? "cf-heatmap__subtotal"
        : row.kind === "grandtotal" ? "cf-heatmap__grandtotal" : "";

      // thin: renders as the dimmer, half-height companion row (used for the actual
      // series only when both series are shown together). series: which data source
      // the cells read from and tag onto data-hm-series, for the tooltip to key off.
      function pillRowHtml(dataMap, totalVal, thin, series) {
        var rowClasses = (baseRowClass ? [baseRowClass] : []).concat(thin ? ["cf-heatmap__actual-row"] : []);
        var out = "<tr" + (rowClasses.length ? ' class="' + rowClasses.join(" ") + '"' : "") + ">";
        out += '<td class="cf-heatmap__label' + (thin ? " cf-heatmap__actual-label" : "") + '" title="' + esc(row.label) + '">' +
          (thin ? "↳ Actual" : (row.code ? '<span class="cf-heatmap__code">' + esc(row.code) + "</span>" : "") + esc(row.label)) + "</td>";
        out += '<td class="cf-heatmap__row-total">' + (totalVal ? fmtMoney(totalVal) : "") + "</td>";
        summary.months.forEach(function (m) {
          var v = (dataMap && dataMap[m]) || 0;
          var cls = "cf-heatmap__cell" + (thin ? " cf-heatmap__cell--actual" : "") + (v ? "" : " cf-heatmap__cell--empty") +
            (highlightCurrentMonth && m === thisMonth ? " cf-heatmap__current" : "");
          var pillStyle = v ? ' style="background:' + heatFill(rowMax > 0 ? Math.abs(v) / rowMax : 0, t.colorScheme, t.sensitivity) + ';"' : "";
          var data = v ? ' data-hm-row="' + ri + '" data-hm-month="' + m + '" data-hm-series="' + series + '"' : "";
          out += '<td class="' + cls + '"' + data + '><span class="cf-heatmap__pill' + (thin ? " cf-heatmap__pill--actual" : "") + '"' + pillStyle + "></span></td>";
        });
        out += "</tr>";
        return out;
      }

      if (t.amountMode === "actual") html += pillRowHtml(row.actualMonthly, row.actualTotal, false, "actual");
      else if (t.amountMode === "both") {
        html += pillRowHtml(row.monthly, row.total, false, "budget");
        html += pillRowHtml(row.actualMonthly, row.actualTotal, true, "actual");
      } else html += pillRowHtml(row.monthly, row.total, false, "budget");
    });
    html += "</tbody></table>";

    var wrap = document.createElement("div");
    wrap.className = "cf-timeline-wrap";
    applyTimelineSizing(wrap);
    wrap.innerHTML = html;
    section.appendChild(wrap);

    if (!forcePrint) {
      var tooltip = document.getElementById("chartTooltip");
      var table = wrap.querySelector(".cf-heatmap");
      table.addEventListener("mousemove", function (ev) {
        var td = ev.target && ev.target.closest ? ev.target.closest("[data-hm-row]") : null;
        if (!td) { tooltip.style.display = "none"; return; }
        var row = rows[Number(td.getAttribute("data-hm-row"))];
        var month = td.getAttribute("data-hm-month");
        var isActual = td.getAttribute("data-hm-series") === "actual";
        var amount = (isActual ? (row.actualMonthly && row.actualMonthly[month]) : row.monthly[month]) || 0;
        var rowTotal = isActual ? row.actualTotal : row.total;
        var share = rowTotal ? (amount / rowTotal) * 100 : 0;
        tooltip.style.display = "block";
        tooltip.innerHTML =
          "<div style='color:var(--text-muted);margin-bottom:2px'>" + esc(row.label) + (isActual ? " — Actual" : "") + "</div>" +
          "<div style='color:var(--text-muted);margin-bottom:2px'>" + esc(fmtMonth(month)) + "</div>" +
          "<div style='font-variant-numeric:tabular-nums;font-weight:600" + (isActual ? ";color:var(--actual)" : "") + "'>" + fmtMoney(amount, true) + "</div>" +
          (rowTotal ? "<div style='color:var(--text-muted);font-size:11px'>" + share.toFixed(1) + "% of " + (isActual ? "actual" : "line") + " total</div>" : "");
        tooltip.style.left = ev.pageX + 12 + "px";
        tooltip.style.top = ev.pageY - 46 + "px";
      });
      table.addEventListener("mouseleave", function () { tooltip.style.display = "none"; });

      // Size controls only move CSS custom properties, so they update live
      // without rebuilding the (potentially thousands of) cells.
      [["tlLength", "cellLength", "tlLengthVal"], ["tlThickness", "cellThickness", "tlThicknessVal"],
       ["tlGap", "cellGap", "tlGapVal"], ["tlSectionGap", "sectionGap", "tlSectionGapVal"]]
        .forEach(function (spec) {
          var input = section.querySelector("#" + spec[0]);
          if (!input) return;
          input.addEventListener("input", function () {
            timelineSettings[spec[1]] = Number(input.value);
            section.querySelector("#" + spec[2]).textContent = input.value + "px";
            applyTimelineSizing(wrap);
          });
          input.addEventListener("change", function () { persist(); });
        });
      // Sensitivity changes every pill's color, so it does need a rebuild.
      var sensInput = section.querySelector("#tlSensitivity");
      if (sensInput) {
        sensInput.addEventListener("input", function () {
          section.querySelector("#tlSensitivityVal").textContent = sensInput.value + "×";
        });
        sensInput.addEventListener("change", function () {
          timelineSettings.sensitivity = Number(sensInput.value);
          persist();
          render();
        });
      }
      var basisSel = section.querySelector("#tlScaleBasis");
      if (basisSel) basisSel.addEventListener("change", function () {
        timelineSettings.scaleBasis = basisSel.value;
        persist();
        render();
      });
      var schemeSel = section.querySelector("#tlColorScheme");
      if (schemeSel) schemeSel.addEventListener("change", function () {
        timelineSettings.colorScheme = schemeSel.value;
        persist();
        render();
      });
      var amountModeSel = section.querySelector("#tlAmountMode");
      if (amountModeSel) amountModeSel.addEventListener("change", function () {
        timelineSettings.amountMode = amountModeSel.value;
        persist();
        render();
      });
    }

    return section;
  }

  function renderTimelineTab(el) {
    var summary = buildSummary(project);
    if (summary.months.length === 0) { el.appendChild(emptyScheduleSection()); return; }
    el.appendChild(buildCashflowTimelineSection(summary, false));
  }

  function emptyScheduleSection() {
    var empty = document.createElement("div");
    empty.className = "section";
    empty.innerHTML = '<p class="section__intro">No scheduled payments yet.</p>';
    return empty;
  }

  function renderCashflowTab(el) {
    var summary = buildSummary(project);
    if (summary.months.length === 0) { el.appendChild(emptyScheduleSection()); return; }
    el.appendChild(buildCashflowSection(summary, false));
  }

  // ---------- Summary (yearly totals + draw request + cap table) ----------
  function buildSummarySection(summary, forcePrint, sectionsFilter) {
    var include = sectionsFilter || { drawsList: true, yearly: true, drawReport: true, capTable: true };
    var collapse = forcePrint ? { drawsList: false } : summarySectionCollapsed;
    var wrap = document.createElement("div");
    wrap.className = "section";

    var annualDrawWrap = buildAnnualDrawSummary(summary, forcePrint, include);
    if (annualDrawWrap) wrap.appendChild(annualDrawWrap);

    if (include.drawsList && summary.draws.length) {
      var sortedDraws = summary.draws.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
      var drawsHtml = summarySectionHeader("drawsList", "Draws", collapse, forcePrint);
      if (!collapse.drawsList) {
        drawsHtml += '<table class="mini-table"><thead><tr><th>Draw</th><th>Date</th><th class="col-money">Amount</th><th>Source</th><th>Period</th><th class="col-money">Period Total</th></tr></thead><tbody>';
        sortedDraws.forEach(function (d) {
          var periodMonths = drawPeriodMonths(summary.months, sortedDraws, d.id);
          var periodLabel = periodMonths.length ? (fmtMonth(periodMonths[0]) + " – " + fmtMonth(periodMonths[periodMonths.length - 1])) : "—";
          var periodTotal = periodMonths.reduce(function (a, m) { return a + (summary.grandTotal.monthly[m] || 0); }, 0);
          drawsHtml += "<tr><td>" + esc(d.name) + "</td><td>" + esc(d.date) + "</td><td class=\"col-money\">" + fmtMoney(d.amount, true) + "</td><td>" + esc(d.source || "") + "</td><td>" + periodLabel + "</td><td class=\"col-money\">" + fmtMoney(periodTotal) + "</td></tr>";
        });
        drawsHtml += "</tbody></table>";
      }
      var drawsDiv = document.createElement("div");
      drawsDiv.className = "section print-fit-section";
      drawsDiv.setAttribute("data-fit-key", "drawsList");
      drawsDiv.innerHTML = drawsHtml;
      wrap.appendChild(drawsDiv);

  function applyFitScaling(wrap, settings, fit) {
    var hasAnyFit = Object.keys(fit).some(function (k) { return fit[k] && fit[k] !== "none"; });

    wrap.style.position = "absolute";
    wrap.style.visibility = "hidden";
    wrap.style.left = "-99999px";
    wrap.style.width = dims.contentWidthPx + "px";
    document.body.appendChild(wrap);

    Array.from(wrap.querySelectorAll("[data-fit-key]")).forEach(function (el) {
      var mode = fit[el.getAttribute("data-fit-key")];
      if (!mode || mode === "none") return;

      var naturalHeight = el.scrollHeight;
      var factor = 1;
      if (mode === "width" && naturalWidth > 0) factor = Math.min(1, dims.contentWidthPx / naturalWidth);
      else if (mode === "height" && naturalHeight > 0) factor = Math.min(1, dims.contentHeightPx / naturalHeight);

      // uniform, so shrinking to fit height doesn't guarantee the width fits too).
      // Leave those untouched here — buildPrintPages splits them into column chunks

  function buildChart(months, monthly) {
    var w = 1200, h = 220, padL = 70, padB = 24, padT = 10, padR = 10;
    var data = months.map(function (m) { return monthly[m] || 0; });
    var maxVal = Math.max.apply(null, data.concat([1]));
    var niceMax = Math.pow(10, Math.floor(Math.log10(maxVal))) * Math.ceil(maxVal / Math.pow(10, Math.floor(Math.log10(maxVal))));
    var plotW = w - padL - padR, plotH = h - padT - padB;

    svg.setAttribute("height", h);

    svg.style.overflow = "visible";

    data.forEach(function (val, i) {
      var barH = niceMax > 0 ? (val / niceMax) * plotH : 0;
      var x = padL + gap * i + (gap - barW) / 2;
      var y = padT + plotH - barH;
      var rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y);
      rect.setAttribute("width", barW); rect.setAttribute("height", Math.max(barH, 0));
      rect.setAttribute("rx", 2.5);
      rect.setAttribute("class", "bar");
      rect.style.cursor = "pointer";
      rect.addEventListener("mousemove", function (ev) {
        tooltip.style.display = "block";
        tooltip.innerHTML = "<div style='color:var(--text-muted);margin-bottom:2px'>" + fmtMonth(months[i]) + "</div><div style='font-variant-numeric:tabular-nums'>" + fmtMoney(val) + "</div>";

        xl.textContent = fmtMonth(months[i]);
        svg.appendChild(xl);
      }
    });

    var holder = document.createElement("div");
    holder.style.position = "relative";
    holder.appendChild(svg);
    return holder;
  }

  // Custom payments are entered independently of totalBudget, so the two can drift
  // apart silently — the grid shows totalBudget in the Budget column but sums the
  // payments into the monthly cells. Returns null when they agree (or can't be compared).
  function scheduleBudgetMismatch(li) {
    if (li.scheduleMode !== "CUSTOM") return null;
    if (linkedBudgetItemsFor(li).length > 0) return null;
    var payments = getLineItemSchedule(li);
    if (!payments.length) return null;
    var scheduled = round2(sum(payments.map(function (p) { return p.amount; })));
    var budget = round2(li.totalBudget || 0);
    if (Math.abs(scheduled - budget) < 0.01) return null;
    return { scheduled: scheduled, budget: budget, delta: round2(scheduled - budget) };
  }

  function lineItemRowHtml(li) {
    var linked = linkedBudgetItemsFor(li);
    var isOverridden = linked.length > 0;
    var effectiveBudget = effectiveLineItemBudget(li);
    var schedule = getLineItemSchedule(li);
    var mismatch = scheduleBudgetMismatch(li);
    var summary = li.scheduleMode === "EVEN"
      ? (li.startDate && li.endDate ? "Even, " + li.startDate + " → " + li.endDate : "Even (set dates)")
      : schedule.length + " custom payment" + (schedule.length === 1 ? "" : "s");
    var catOptions = '<option value="">Uncategorized</option>' + project.categories.map(function (c) {
      return '<option value="' + c.id + '"' + (li.categoryId === c.id ? " selected" : "") + ">" + esc(c.name) + "</option>";
    }).join("");
    var linkedNote = isOverridden ? " — " + linked.length + " linked budget line" + (linked.length === 1 ? "" : "s") : "";
    var budgetCell = isOverridden
      ? '<td class="col-money"><span class="money-input"><input type="number" class="editable-number" value="' + round2(effectiveBudget) + '" disabled title="Driven by ' + linked.length + ' linked budget line' + (linked.length === 1 ? "" : "s") + " — edit on the Budget tab\" /></span></td>"
      : '<td class="col-money"><span class="money-input"><input type="number" class="editable-number" value="' + li.totalBudget + '" data-item-field="totalBudget" data-item-id="' + li.id + '" /></span></td>';
    var scheduleCell = isOverridden
      ? '<td class="col-schedule"><span class="schedule-editor__hint">Set on Budget tab' + linkedNote + "</span></td>"
      : '<td class="col-schedule"><button class="link-button" data-toggle-schedule="' + li.id + '">' + (expandedLineItemId === li.id ? "▾ " : "▸ ") + esc(summary) + "</button>" +
        (mismatch
          ? '<span class="budget-mismatch" title="The custom payments on this line add up to ' + fmtMoney(mismatch.scheduled, true) +
            ", but its budget is " + fmtMoney(mismatch.budget, true) + '. The cashflow grid charts the payments, not the budget.">⚠ payments ' +
            fmtMoney(mismatch.scheduled) + " ≠ budget " + fmtMoney(mismatch.budget) +
            " (" + (mismatch.delta > 0 ? "+" : "") + fmtMoney(mismatch.delta) + ")</span>"
          : "") + "</td>";
    var rows = '<tr data-item-row="' + li.id + '">' +
      '<td class="col-code"><input class="editable-text" value="' + esc(li.code || "") + '" data-item-field="code" data-item-id="' + li.id + '" /></td>' +
      '<td><input class="editable-text" value="' + esc(li.description) + '" data-item-field="description" data-item-id="' + li.id + '" /></td>' +
      '<td class="col-category"><select class="category-select" data-item-field="categoryId" data-item-id="' + li.id + '">' + catOptions + "</select></td>" +
      budgetCell + scheduleCell +
      '<td class="col-actions"><button class="link-button link-button--danger" data-delete-item="' + li.id + '">delete</button></td>' +
      "</tr>";
    if (!isOverridden && expandedLineItemId === li.id) {
      rows += '<tr class="schedule-row"><td colspan="6">' + scheduleEditorHtml(li) + "</td></tr>";
    }
    return rows;
  }

  // Shared by the line item and budget item schedule editors: a dated ledger of money
  // actually spent, kept separate from the projected schedule so entering an actual
  // never overwrites the budget it's being compared against. `kind` + `id` are packed
  // into every data attribute ("li|<id>" / "bi|<id>") so one set of handlers in
  // wireLineItemEvents/wireBudgetEvents can serve both editors.
  function actualsEditorHtml(kind, id, actuals, budgetTotal) {
    var sorted = actuals.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    var total = sum(sorted.map(function (a) { return a.amount; }));
    var variance = total - budgetTotal;
    var key = kind + "|" + id;
    var html = '<div class="actuals-editor">' +
      '<div class="actuals-editor__title">Actuals <span class="actuals-editor__hint">money actually spent — tracked separately from the budget above</span></div>' +
      '<table class="mini-table"><thead><tr><th>Date</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>';
    sorted.forEach(function (a) {
      html += "<tr><td>" + fmtDate(a.date) + "</td><td>" + fmtMoney(a.amount, true) + "</td><td>" + esc(a.note || "") +
        '</td><td><button class="link-button" data-remove-actual="' + key + "|" + a.id + '">remove</button></td></tr>';
    });
    html += '<tr><td><input type="date" data-new-actual-date="' + key + '" /></td>' +
      '<td><input type="number" placeholder="0.00" data-new-actual-amount="' + key + '" /></td>' +
      '<td><input type="text" placeholder="note (optional)" data-new-actual-note="' + key + '" /></td>' +
      '<td><button class="link-button" data-add-actual="' + key + '">add</button></td></tr></tbody></table>';
    if (sorted.length) {
      html += '<div class="actuals-editor__total">Actual total ' + fmtMoney(total, true) +
        (budgetTotal ? " vs budget " + fmtMoney(budgetTotal, true) + " (" + (variance > 0 ? "+" : "") + fmtMoney(variance, true) + ")" : "") +
        "</div>";
    }
    html += "</div>";
    return html;
  }

  function findActualsEntity(kind, id) { return kind === "li" ? findLineItem(id) : findBudgetItem(id); }

  function wireActualsEvents(root) {
    root.querySelectorAll("[data-add-actual]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-add-actual").split("|");
        var entity = findActualsEntity(parts[0], parts[1]);
        var key = parts[0] + "|" + parts[1];
        var dateInput = root.querySelector('[data-new-actual-date="' + key + '"]');
        var amountInput = root.querySelector('[data-new-actual-amount="' + key + '"]');
        var noteInput = root.querySelector('[data-new-actual-note="' + key + '"]');
        if (!dateInput.value || !amountInput.value) return;
        if (!entity.actuals) entity.actuals = [];
        entity.actuals.push({ id: genId("act"), date: dateInput.value, amount: Number(amountInput.value), note: noteInput.value || null });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-remove-actual]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-remove-actual").split("|");
        var entity = findActualsEntity(parts[0], parts[1]);
        entity.actuals = entity.actuals.filter(function (a) { return a.id !== parts[2]; });
        render();
        persist();
      });
    });
  }

  function scheduleEditorHtml(li) {
    var isEven = li.scheduleMode === "EVEN";
    var html = '<div class="schedule-editor">' +
      '<div class="schedule-editor__mode">' +
        '<label><input type="radio" name="mode-' + li.id + '"' + (isEven ? " checked" : "") + ' data-mode-radio="' + li.id + '" value="EVEN" /> Spread evenly between dates</label>' +
        '<label><input type="radio" name="mode-' + li.id + '"' + (!isEven ? " checked" : "") + ' data-mode-radio="' + li.id + '" value="CUSTOM" /> Specific payment dates</label>' +
      "</div>";
    if (isEven) {
      var schedule = getLineItemSchedule(li);
      html += '<div class="schedule-editor__even">' +
        '<label>Start<input type="date" value="' + esc(li.startDate || "") + '" data-even-field="startDate" data-item-id="' + li.id + '" /></label>' +
        '<label>End<input type="date" value="' + esc(li.endDate || "") + '" data-even-field="endDate" data-item-id="' + li.id + '" /></label>';
      if (li.startDate && li.endDate) {
        html += '<span class="schedule-editor__hint">' + schedule.length + " monthly payment" + (schedule.length === 1 ? "" : "s") + " of " + fmtMoney(li.totalBudget / Math.max(schedule.length, 1)) + " each</span>";
      }
      html += "</div>";
    } else {
      var scheduleTotal = sum(li.payments.map(function (p) { return p.amount; }));
      var variance = scheduleTotal - li.totalBudget;
      html += '<div class="schedule-editor__custom"><table class="mini-table"><thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>';
      li.payments.slice().sort(function (a, b) { return a.date.localeCompare(b.date); }).forEach(function (p) {
        html += "<tr><td>" + fmtDate(p.date) + "</td><td>" + fmtMoney(p.amount, true) + '</td><td><button class="link-button" data-remove-payment="' + li.id + "|" + p.id + '">remove</button></td></tr>';
      });
      html += '<tr><td><input type="date" data-new-payment-date="' + li.id + '" /></td><td><input type="number" placeholder="0.00" data-new-payment-amount="' + li.id + '" /></td>' +
        '<td><button class="link-button" data-add-payment="' + li.id + '">add</button></td></tr></tbody></table>';
      if (Math.abs(variance) > 0.01) {
        html += '<div class="schedule-editor__variance">Payments total ' + fmtMoney(scheduleTotal, true) + ", budget is " + fmtMoney(li.totalBudget, true) + " (" + (variance > 0 ? "+" : "") + fmtMoney(variance, true) + ")</div>";
      }
      html += "</div>";
    }
    html += actualsEditorHtml("li", li.id, li.actuals || [], li.totalBudget);
    html += "</div>";
    return html;
  }

  function findLineItem(id) { return project.lineItems.filter(function (li) { return li.id === id; })[0]; }

  function wireLineItemEvents(root) {
    root.querySelectorAll("[data-item-field]").forEach(function (input) {
      input.addEventListener("change", function () {
        var li = findLineItem(input.getAttribute("data-item-id"));
        var field = input.getAttribute("data-item-field");
        if (field === "totalBudget") li[field] = Number(input.value) || 0;

        else li[field] = input.value;
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-cat-rename]").forEach(function (input) {
      input.addEventListener("change", function () {
        var cat = project.categories.filter(function (c) { return c.id === input.getAttribute("data-cat-rename"); })[0];
        cat.name = input.value;
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-cat-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-cat-delete");
        var hasItems = project.lineItems.some(function (li) { return li.categoryId === id; });
        if (hasItems) { alert("Move or delete line items out of this category first."); return; }
        project.categories = project.categories.filter(function (c) { return c.id !== id; });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-add-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var catId = btn.getAttribute("data-add-item") || null;
        project.lineItems.push({ id: genId("li"), categoryId: catId, code: "", description: "New line item", totalBudget: 0, scheduleMode: "EVEN", startDate: null, endDate: null, sortOrder: project.lineItems.length, payments: [], actuals: [], color: null });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-delete-item]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete-item");
        var li = findLineItem(id);
        if (confirm('Delete "' + li.description + '"?')) {
          project.lineItems = project.lineItems.filter(function (x) { return x.id !== id; });
          render();
          persist();
        }
      });
    });
    root.querySelectorAll("[data-toggle-schedule]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-toggle-schedule");
        expandedLineItemId = expandedLineItemId === id ? null : id;
        render();
      });
    });
    root.querySelectorAll("[data-mode-radio]").forEach(function (radio) {
      radio.addEventListener("change", function () {
        findLineItem(radio.getAttribute("data-mode-radio")).scheduleMode = radio.value;
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-even-field]").forEach(function (input) {
      input.addEventListener("change", function () {
        findLineItem(input.getAttribute("data-item-id"))[input.getAttribute("data-even-field")] = input.value;
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-add-payment]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add-payment");
        var dateInput = root.querySelector('[data-new-payment-date="' + id + '"]');
        var amountInput = root.querySelector('[data-new-payment-amount="' + id + '"]');
        if (!dateInput.value || !amountInput.value) return;
        findLineItem(id).payments.push({ id: genId("pay"), date: dateInput.value, amount: Number(amountInput.value) });
        render();
        persist();
      });
    });
    root.querySelectorAll("[data-remove-payment]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-remove-payment").split("|");
        var li = findLineItem(parts[0]);
        li.payments = li.payments.filter(function (p) { return p.id !== parts[1]; });
        render();
        persist();
      });
    });
  }

      html += '<div class="schedule-editor__custom"><table class="mini-table"><thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>';

      }
      html += "</div>";
    }
    html += actualsEditorHtml("bi", bi.id, bi.actuals || [], bi.totalBudget);
